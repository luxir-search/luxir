syntax = "proto3";

package luxir.index;

message FileDescriptor {
  string name = 1;
  uint64 size = 2;
  fixed64 xxh3 = 3;
}

message IndexInfo {
  uint64 version = 1;                 // Version of the index format
  uint64 commit_time = 2;             // Commit time of this index (microseconds since epoch)
  uint64 index_gen = 3;               // Generation of this index (incremented on each commit)
  uint64 core_gen = 4;                // Segment composition generation (incremented only when segments change, not deletes)
  uint64 update_version = 5;          // Highest update version in this index (incremented on each update)
  uint64 schema_gen = 6;             // Schema generation (incremented on each schema change)
  SchemaInfo schema = 7;             // Query schema and field history for this snapshot
  string incarnation = 8;            // Collection UUID, changes on recreate
  uint64 last_seg_id = 9;             // Allocation high-water mark, including retired segments
  repeated SegmentInfo segments = 15; // List of segments in this index

  // Auxiliary indexes built at index scope. Segment-local overlays live on
  // SegmentInfo.overlays.
  repeated AuxIndexInfo aux_indexes = 16;

  // Collection-level summary: the union of every segment's FieldSummary
  // records (no payloads), one per physical field, sorted by name. Lets a
  // query be rejected for the whole collection without reading a segment.
  repeated FieldSummary field_summaries = 17;
  // False when some segment had no readable summary; the aggregate is then
  // only an estimate and proves nothing.
  bool summary_complete = 18;
}

// One physical field's summary, in a segment summary sidecar or in the
// collection aggregate. Bounds are conservative supersets of the values the
// field holds (deleted documents may be counted); see
// docs/design/segment-summaries.md for the exact semantics. Fields shared
// with SegFieldInfo carry its names (fieldname, flags, nTerms, ...).
message FieldSummary {
  string fieldname = 1;            // physical field name as the segment stores it
  uint32 type = 2;                 // FieldType::Type ordinal persisted by the segment
  uint32 summary_flags = 3;        // SegmentSummary::Flags bitset
  uint64 docs_with_field = 4;
  uint64 num_values = 5;           // column values; valid with HAS_NUM_VALUES
  uint64 sum_doc_freq = 6;         // BM25 header totals, indexed fields only
  uint64 sum_total_term_freq = 7;
  uint64 n_terms = 8;              // distinct indexed terms
  sint64 num_min = 9;              // encoded int64 column bounds; valid with HAS_NUMERIC
  sint64 num_max = 10;
  sint32 geo_min_lat = 11;         // encoded int32 lat/lon box; valid with HAS_GEO_BOX
  sint32 geo_max_lat = 12;
  sint32 geo_min_lon = 13;         // never wraps the antimeridian
  sint32 geo_max_lon = 14;
  bytes term_min = 15;             // fitted term bytes; valid with HAS_TERM_BOUNDS
  bytes term_max = 16;             // rounded up when truncated, so still an upper bound
  repeated SummaryPayload payloads = 17; // sidecar only
  uint32 segments_with_field = 18; // aggregate only
  uint32 flags = 19;               // FieldType flags incl. segment markers; OR-ed in the aggregate
  uint32 type_flags = 20;          // interpreted by type; a mismatch across segments drops the aggregate's bounds
}

// A bulky structure in the sidecar's payload area. Unknown kinds or versions
// are skipped by readers, so new kinds never invalidate a file.
message SummaryPayload {
  uint32 kind = 1;     // SegmentSummary::PayloadKind
  uint32 version = 2;  // layout version of this kind
  uint64 offset = 3;   // offset from the start of the payload area (header indexLen), 8-aligned
  uint64 length = 4;
  uint64 count = 5;    // keys in a filter, entries in a set, vectors in a centroid
  uint64 seed = 6;     // filter seed
  uint32 param = 7;    // kind-specific: prefix length, Bloom k, vector dims
}

// Section 1 of a segment summary sidecar: the file of the segment overlay of
// kind "segment_summary" (SegmentSummary::OVERLAY_KIND).
message SegmentSummaryInfo {
  uint32 version = 1;        // sidecar format version
  uint32 hash_version = 2;   // luxir::summary::HASH_VERSION of every filter key
  uint64 seg_id = 3;
  int32 max_doc = 4;
  // Every indexed or column field of the segment has a record, so a field
  // without one holds no document. Stored-field resources are never listed.
  bool complete = 5;
  repeated FieldSummary fields = 6; // sorted by field name
}

// Authored schema and field introduction history embedded in the manifest.
message SchemaInfo {
  bytes source_def = 1; // encoded luxir.SchemaDef
  map<string, uint64> introduced_gen = 2; // physical field name to introduction generation
}

// An auxiliary index entry built at a particular commit. Used for both
// index-level aux indexes and segment-local overlays.
// Files use the naming convention "s_<name>_<sortable_gen>_<sortable_fnum>".
message AuxIndexInfo {
  string kind = 1;             // e.g. "vector_faiss"
  string field = 2;            // empty if not field-scoped
  string name = 3;             // unique identifier; convention: "<kind_short>.<field>" (e.g. "vec.title_v")
  uint64 gen = 4;              // Build generation, local to this aux index
  uint64 commit_time = 5;      // microseconds since epoch
  repeated FileDescriptor files = 6; // Immutable files owned by this aux index
  bytes opaque_meta = 7;       // kind-specific metadata blob

  // Index-level core_gen stamp. Segment overlays, including vector ANN
  // overlays, leave this at 0; their validity is segment liveness.
  uint64 built_core_gen = 8;
}

// Per-segment information.
message SegmentInfo {
  uint64 seg_id = 1;                    // Unique identifier for the segment
  uint64 live_gen = 2;                  // Generation for live docs file (0 = all live, no deletes, no file)
  uint64 min_version = 3;               // Minimum update version in this segment
  uint64 max_version = 4;               // Maximum update version in this segment
  uint64 commit_time = 5;               // First time this segment was committed (microseconds since epoch)
  int32 max_doc = 6;                    // Number of documents in this segment (ignoring deletes)
  int32 live_docs = 7;                  // Number of non-deleted documents in this segment
  uint64 schema_gen = 8;                // Minimum input schema generation; merges never imply backfill

  // Segment-local auxiliary overlays. Vector ANN indexes are recorded here
  // with kind "vector_faiss"; validity is segment liveness, not core_gen.
  repeated AuxIndexInfo overlays = 9;
  repeated FileDescriptor files = 10; // Segment data and current liveDocs
  uint64 next_overlay_gen = 11; // Persistent high-water mark, including dropped overlays
}
