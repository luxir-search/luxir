syntax = "proto3";

package luxir.index;

message IndexInfo {
  uint64 version = 1;                 // Version of the index format
  uint64 commit_time = 2;             // Commit time of this index (microseconds since epoch)
  uint64 index_gen = 3;               // Generation of this index (incremented on each commit)
  uint64 core_gen = 4;                // Segment composition generation (incremented only when segments change, not deletes)
  uint64 update_version = 5;          // Highest update version in this index (incremented on each update)
  uint64 schema_gen = 6;              // Schema generation (incremented on each schema change)
  repeated SegmentInfo segments = 15; // List of segments in this index

  // Auxiliary indexes built at index scope. Segment-local overlays live on
  // SegmentInfo.overlays.
  repeated AuxIndexInfo aux_indexes = 16;
}

// An auxiliary index entry built at a particular commit. Used for both
// index-level aux indexes and segment-local overlays.
// Files use the naming convention "s_<name>_<sortable_gen>_<sortable_fnum>".
message AuxIndexInfo {
  string kind = 1;             // e.g. "vector_faiss"
  string field = 2;            // empty if not field-scoped
  string name = 3;             // unique identifier; convention: "<kind_short>.<field>" (e.g. "vec.title_v")
  uint64 gen = 4;              // index_gen this aux index was built at
  uint64 commit_time = 5;      // microseconds since epoch
  repeated string files = 6;   // segment-style filenames that comprise this aux index
  bytes opaque_meta = 7;       // kind-specific metadata blob

  // Index-level core_gen stamp. Segment overlays, including vector ANN
  // overlays, leave this at 0; their validity is segment liveness.
  uint64 built_core_gen = 8;
}

// Per-segment information.
message SegmentInfo {
  uint64 seg_id = 1;                    // Unique identifier for the segment
  uint64 live_gen = 2;                  // Generation for live docs file (0 = all live, no deletes, no file)
  uint64 min_version = 3;               // Minimum update version in this segment
  uint64 max_version = 4;               // Maximum update version in this segment
  uint64 commit_time = 5;               // First time this segment was committed (microseconds since epoch)
  int32 max_doc = 6;                    // Number of documents in this segment (ignoring deletes)
  int32 live_docs = 7;                  // Number of non-deleted documents in this segment
  uint64 schema_gen = 8;                // Schema generation this segment was indexed under

  // Segment-local auxiliary overlays. Vector ANN indexes are recorded here
  // with kind "vector_faiss"; validity is segment liveness, not core_gen.
  repeated AuxIndexInfo overlays = 9;
}
