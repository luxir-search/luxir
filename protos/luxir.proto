syntax = "proto3";

import "luxir_types.proto";

option java_package = "org.luxir";
option java_outer_classname = "LuxirProto";
option objc_class_prefix = "Luxir";

package luxir;

service Indexer {
  // Index or delete documents, with an optional commit.
  rpc Update(UpdateRequest) returns (UpdateResponse) {}

  // One response per request; request_id correlates responses with requests.
  rpc UpdateStream(stream UpdateRequest) returns (stream UpdateResponse) {}
}

service Searcher {
  // Each request produces one or more responses, ending with more=false.
  // Use request_id to correlate responses when sending multiple requests.
  rpc Search(stream SearchRequest) returns (stream SearchResponse) {}
}

service Admin {
  rpc SetSchema(SchemaRequest) returns (SchemaResponse) {}
  rpc GetSchema(SchemaRequest) returns (SchemaResponse) {}
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse) {}
  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse) {}
  // Adopts a collection whose files were placed in the data directory while
  // the node runs (a restore), without a restart.
  rpc OpenCollection(OpenCollectionRequest) returns (OpenCollectionResponse) {}
  // Unregisters and closes a collection without a restart, optionally only if
  // nothing changed since a named commit, so its directory can be released.
  rpc CloseCollection(CloseCollectionRequest) returns (CloseCollectionResponse) {}
  rpc Stats(StatsRequest) returns (StatsResponse) {}
  rpc CacheControl(CacheControlRequest) returns (CacheControlResponse) {}
}
