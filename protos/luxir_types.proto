syntax = "proto3";

import "google/protobuf/struct.proto";

option java_package = "org.luxir.types";
option java_outer_classname = "LuxirTypes";
option objc_class_prefix = "Luxir";

package luxir;

// Bit positions in the packed request option word, not masks. The two date
// bits form one field: native=0, iso=1, ms=2, ns=3.
enum RequestFlagBit {
  DATE_MODE_LOW_BIT = 0;
  DATE_MODE_HIGH_BIT = 1;
  INT64_STR_BIT = 2; // request-only: quote JSON integers outside the safe range
}

// Top-level search request that can contain multiple search operations.
message SearchRequest {
  // Optional opaque identifier, echoed in every response to this request.
  // Use distinct identifiers to correlate requests and responses in a stream.
  string request_id = 1;
  string collection = 2; // empty selects the default collection, "main"

  // Multiple search operations in a single request.
  map<string, SearchOp> ops = 3;

  // Index view freshness tolerance in milliseconds. 0 (the default) requires the
  // latest advertised commit: wait for an immediate commit's response, and a
  // freshness_ms=0 search is guaranteed to see it.
  // A positive value lets the search reuse a reader up to this stale, avoiding
  // reader churn under frequent commits. It is a tolerance, not a latency bound:
  // there is no guaranteed time from ingest to visibility.
  uint64 freshness_ms = 4;

  // Time zone for date math and date literals without an offset. Empty is UTC;
  // accepts Z, UTC, fixed offsets, or a case-sensitive IANA zone name.
  string time_zone = 5;

  // HTTP response framing. ENVELOPE (default): one JSON envelope per batch.
  // DOCS: one document per line, with optional _header_ metadata records.
  // The HTTP ?format=docs parameter also selects DOCS. gRPC rejects DOCS.
  // See docs/guide/http-api.md for the NDJSON formats.
  ResponseFormat response_format = 6;

  // Return execution details for instrumented operations; see ExecutionProfile.
  bool profile = 7;

  // Intra-request parallelism: 0 (default) lets the engine choose, today
  // serial: over HTTP normally inline on the receiving thread, over gRPC on
  // the shared executor. 1 runs serially on the shared executor; -1 permits
  // unlimited parallelism, with shared workers joining in (starting on the
  // receiving HTTP thread, or on the shared executor over gRPC). Other values
  // are rejected.
  int32 max_parallel = 8;

  // Require a local snapshot at least this new (incarnation:index_gen).
  // Writers reject a different incarnation immediately; followers wait for a switch.
  string min_commit = 9;
  // Search floor deadline. Absent defaults to 30000; zero checks immediately.
  optional uint64 min_commit_timeout_ms = 10;

  // Packed request options. Effective = (inherited & ~flags_set) |
  // (flags & flags_set); the request inherits 0. JSON uses lowercase names,
  // e.g. "flags": ["date_ms"], rather than numeric flags/flags_set.
  // Date modes control numeric date literal units: ms or ns overrides the
  // field unit; native and iso use the field unit. Value arithmetic is unchanged.
  uint64 flags = 11;
  // Override mask. Set both date-mode bits (3), or neither. Request-only
  // int64_str (bit 2) quotes JSON int64/uint64 values outside the safe integer
  // range, +/- (2^53 - 1). Unknown bits are rejected in either word.
  // Binary gRPC responses retain their integer types.
  uint64 flags_set = 12;
}

enum ResponseFormat {
  ENVELOPE = 0;
  DOCS = 1;
}

// A named search operation. The name is its key in the enclosing ops map.
message SearchOp {
  oneof kind {
    TopDocs top_docs = 1;
    Fusion fusion = 2;
    FieldFacet field_facet = 8;
    RangeFacet range_facet = 9;
    QueryFacet query_facet = 10;
    ExprOp expr_op = 15;
    PluginOp plugin = 16;           // an operation registered by a compiled-in plugin
  }
  Domain domain = 20; // optional override of the incoming document domain
  // Overrides the parent's packed options, including for this op's domain,
  // queries and facet literals. Subops inherit this op's effective options.
  // JSON uses the same lowercase flags name array as SearchRequest.
  uint64 flags = 21;
  // Override mask. int64_str is request-only: bit 2 is rejected in both
  // flags and flags_set, including an attempted clear. Other validation is
  // the same as SearchRequest.flags_set.
  // Naming date_native in JSON explicitly replaces an inherited date mode.
  uint64 flags_set = 22;
}

// An operation registered by a compiled-in plugin (see docs/dev/plugins.md).
// The JSON dialect also accepts a registered plugin name as the arm key:
// {"my_op": {"a": 1, "ops": {...}}} reads as
// {"plugin": {"name": "my_op", "params": {"a": 1}, "ops": {...}}}.  An
// unregistered name is a request error that lists the registered operations.
// The plugin validates params and defines the result shape; nested ops run
// over the domain the plugin gives them and may not override it.
message PluginOp {
  string name = 1;
  map<string, Val> params = 2;
  map<string, SearchOp> ops = 3;
}

// An expression aggregate over the operation's incoming document domain.
// The operation name is the key in the enclosing ops map.
message ExprOp {
  string expr = 1;
  map<string, Val> vars = 2;
}

// Placement of returned document fields: dense columns (DocList.columns)
// or per-document maps (DocList.docs).  A document is the merge of columns
// row i and docs[i]; a field is never in both.  A missing value is an
// absent key in docs[i] or the column's missing sentinel.  A field with no
// value in a batch is left out of that batch, except a named field under
// COLUMNS, whose column is present in every batch.  DEFAULT resolves per
// transport: HTTP/JSON -> ROWS, gRPC -> COLUMNS.
enum DocFormat {
  DEFAULT = 0;
  ROWS = 1;      // every field in docs
  COLUMNS = 2;   // every field as a column
  ADAPTIVE = 3;  // per batch and field, whichever encodes the batch more compactly
}

// Partition matching documents by an exact, single-valued key.
message Collapse {
  repeated string field = 1; // One field, or an exact tuple. Uses value binding.
  enum MissingPolicy {
    EXPAND = 0; // Each document missing any component is a tagged singleton.
    GROUP = 1;  // Preserve present tuple components and tag missing ones as null.
    DROP = 2;   // Exclude documents missing any component.
  }
  MissingPolicy missing = 2;
  repeated SortSpec head_sort = 3; // Display member order; defaults to the list sort.
  bool get_count = 4; // Count members of each returned group in the finalized match set.
  // Per-group operations on matching members; facet count units start at docs.
  // Explicit group units still resolve to this nearest enclosing collapse.
  map<string, SearchOp> ops = 5;
  // Exhaustive group order by metrics in ops; missing/failed values last.
  // Ties use the best member under the list sort, then document order.
  repeated SortSpec sort = 6;
}

// A document cap, applied before paging in the list's ordinary rank order.
message Diversify {
  repeated string field = 1; // One field or an exact tuple, as in Collapse.
  Collapse.MissingPolicy missing = 3;
  oneof kind {
    int64 max_per_key = 2; // Positive cap; keeps each key's best documents.
  }
}

message TopDocs {
  Query query = 1;            // unset selects all documents (browse / filter-only search)
  repeated Filter filter = 2;

  // Zero-based rank of the first returned document; must be >= 0. Skip this
  // many ranked matches, then return up to limit (-1: all remaining; 0: none).
  // Each response DocList.offset is the absolute rank of that batch's first
  // row, or the requested offset for an empty page. Ignored as a Fusion source.
  int64 offset = 3;

  // Maximum documents to return. Unset = 10; 0 = none; -1 = all remaining.
  optional sint64 limit = 4;
  // Match count: unset or 0 omits found; -1 counts exactly; positive N permits
  // stopping at N with found_gte. An exact count is also valid for N.
  // Must be >= -1. Ops, collapse, diversify, field sorts, nested lists and
  // limit 0 retain exact counting.
  optional sint64 count_limit = 5;
  bool get_scores = 6;          // return the relevancy score for each document returned

  // Fields to return for each document.  Empty returns every retrievable field
  // (stored or column-backed; not vectors or engine fields such as _version_),
  // discovered from the index; placement follows document_format.
  // A name containing '*' is a pattern expanded the same way: the matching
  // retrievable fields; matching nothing is not an error.  Explicitly
  // named fields win on collision and may name anything, vectors and engine
  // fields included.
  repeated string fields = 7;
  repeated SortSpec sort = 8;

  // Maximum documents per streaming batch. Nonpositive = default (100);
  // the server caps positive values at 256. More documents produce more
  // batches. Ignored beneath a facet bucket, where all rows return together.
  int32 batch_size = 9;
  DocFormat document_format = 10;  // placement of returned fields: rows, columns, or adaptive (see DocFormat)

  Diversify diversify = 12; // Incompatible with collapse; found counts capped documents.
  Collapse collapse = 11; // limit, offset and found count groups; found_docs counts eligible documents.

  // Minimum score cut-off. When set, documents whose query score is below
  // this value do not match: they are excluded from the returned documents,
  // from the match count, and from the domain of ops (facets and
  // metrics). The score compared is the query's own relevance score (filters
  // do not score), computed even when the request sorts by fields or does not
  // return scores. Must be finite. As a Fusion source, the cut-off applies to
  // that source's ranked list.
  optional float min_score = 14;

  map<string, SearchOp> ops = 15;  // sub-facets or search operations performed over docs that match this query.
}

// Hybrid-search fusion: run several source queries (each a full TopDocs spec)
// and merge their results into a single ranked list.
//
// Per-source response-shape fields (`fields`, `batch_size`, `offset`,
// `get_scores`, `count_limit`, `document_format`) are ignored - Fusion controls
// response shape at the top level. Per-source `ops` are rejected; put facets
// and metrics in Fusion.ops.
// Each source's `query`, `sort`, `limit`, and any per-source `filter` are used
// to produce that source's ranked list. A source collapse accepts only field
// and missing, and its limit counts groups; the head documents enter document fusion.
// Source collapse head_sort, sort, get_count and ops are errors.
//
// The fusion-level `filter` is ANDed with each source's own filters.
message Fusion {
  // Named source queries. At least one source is required.
  map<string, TopDocs> sources = 1;

  // Filters applied to every source. except_ops is not supported here or
  // in source filters.
  repeated Filter filter = 2;

  // Maximum fused rows (groups with collapse) to return. Unset = 10; 0 = none; -1 = all remaining.
  optional sint64 limit = 3;

  // Required fusion method: exactly one.
  oneof method {
    RrfFusion rrf = 10;
    LinearFusion linear = 11;
  }

  // Response shape (mirrors TopDocs).
  // Zero-based rank of the first returned fused row; must be >= 0.
  // Return up to limit after skipping. Source limits remain candidate-pool
  // sizes: paging cannot reach beyond the union of their ranked windows.
  // Each response DocList.offset is the absolute rank of that batch's first
  // row, or the requested offset for an empty page.
  int64 offset = 4;
  // Match count: unset or 0 omits found; -1 requests exact; positive N permits
  // a lower bound. Fusion always supplies an exact count, also valid for N.
  // Counts eligible groups with collapse, otherwise source-union documents.
  // Must be >= -1.
  optional sint64 count_limit = 5;
  bool get_scores = 6;
  repeated string fields = 7;   // as TopDocs.fields: empty returns every retrievable field, '*' patterns expand
  int32 batch_size = 8; // same batching rules as TopDocs.batch_size
  DocFormat document_format = 9;  // placement of returned fields: rows, columns, or adaptive (see DocFormat)

  // Collapse the fused document list before paging. Source windows never refill.
  // found counts eligible groups; found_docs counts eligible fused documents.
  Collapse collapse = 17;

  // Runs over the union of filtered source ranked lists, even with collapse.
  // Fusion limit and offset do not affect this candidate domain.
  map<string, SearchOp> ops = 15;

  // Per-source weights keyed by source name, used by the fusion method.
  // A source without an entry has weight 1. Weights must be finite, >= 0,
  // and within float range, every key must name a source, and at least one
  // source must have a weight > 0. A zero weight disables its source: it is
  // not executed and its documents do not enter the fused list, found, or the
  // ops domain.
  map<string, double> weights = 16;
}

// Reciprocal Rank Fusion: fused_score(d) = sum over sources s of
// weight_s / (k + rank_s(d)), where rank_s(d) is d's 1-based rank in source
// s (sources without d contribute nothing) and weight_s comes from
// Fusion.weights.
message RrfFusion {
  optional int32 k = 1;  // rank-smoothing constant, >= 0; unset selects 60
}

// Weighted linear fusion of normalized scores: fused_score(d) = sum over
// sources s of weight_s * normalized_s(d), where weight_s comes from
// Fusion.weights and sources without d contribute nothing. Each source's
// scores are normalized over its ranked list after merging across segments.
// Sources must rank by relevance score: a source with a sort other than
// score descending (optionally followed by _docid_ ascending) is rejected.
message LinearFusion {
  enum Normalization {
    // (score - min) / (max - min) over the source's ranked list, so its best
    // document gets 1 and its worst gets 0. A list whose scores are all
    // equal (including a single document) normalizes every document to 1.
    // NaN scores contribute 0 and are left out of min and max; +inf
    // normalizes to 1 and -inf to 0.
    MIN_MAX = 0;
  }
  Normalization normalization = 1;  // unset selects MIN_MAX
}

message SortSpec {
  string expr = 1;
  map<string, Val> vars = 2;

  enum SortDir {
    UNKNOWN = 0;
    ASC = 1;
    DESC = 2;
  }
  SortDir dir = 10;
}

message Query {
  // An unset kind selects all documents, same as `all`.
  oneof kind {
    Match match = 1;                // selects all documents with a value match in the specified field
    BooleanQuery boolean = 2;
    bool all = 3;                   // selects all documents
    ExistsQuery exists = 4;         // selects documents that supplied a value for the field
    PhraseQuery phrase = 5;         // selects all documents with a phrase
    KnnQuery knn = 6;               // nearest-neighbor search over a vector field
    ConstantScoreQuery constant_score = 7; // wraps a query and replaces each hit's score
    PrefixQuery prefix = 8;         // selects documents by term prefix
    FuzzyQuery fuzzy = 9;           // selects documents by fuzzy (edit-distance) term match
    SimpleQuery simple_query = 10;  // forgiving end-user query string (search-box input)
    RangeQuery range = 11;          // selects documents with a field value in a range
    ExprQuery expr = 12;            // an expression in the Luxir query language (rigorous grammar)
    GeoBoxQuery geo_box = 13;       // selects GEO_POINT values inside an inclusive bounding box
    GeoDistanceQuery geo_distance = 14; // selects GEO_POINT values within a radius of a center
    BoostQuery boost = 15;          // multiplies every hit score of a wrapped query
    RescoreQuery rescore = 16;      // preserves matches and replaces each hit's score
    WildcardQuery wildcard = 17;    // selects documents by wildcard term match
    RegexQuery regex = 18;          // selects documents by regular-expression term match
    AnyOfQuery any_of = 19;         // constant-score exact value-set membership
    MultiMatchQuery multi_match = 20; // one text over several weighted fields
    DisMaxQuery dis_max = 25;       // best query score plus tie times the other scores
    PluginQuery plugin = 26;        // a query type registered by a compiled-in plugin
  }
}

message ExistsQuery {
  string field = 1;
}

message ConstantScoreQuery {
  Query query = 1;

  // Score assigned to every match. Unset = 1.0; an explicit 0.0 is preserved.
  optional float score = 2;
}

message BoostQuery {
  Query query = 1;

  // Score multiplier. Unset = 1.0; 0 preserves matches with zero scores.
  // Must be finite and >= 0.
  optional float boost = 2;
}

message RescoreQuery {
  Query query = 1;
  string expr = 2;
  map<string, Val> vars = 3;

  // Minimum rescored value. Documents whose expression output is below it do
  // not match, in scored and unscored (filter) positions alike. Compared
  // before any enclosing boost. Must be finite.
  optional float min_score = 4;
}

// Nearest-neighbor query against a searchable vector field. Search is exact
// when no ANN index is available; an ANN index may produce approximate results.
// The query vector must be non-empty and match the field's dimensions.
// Deleted documents and documents outside the enclosing domain are excluded.
// Multi-valued fields return one hit per document using its highest similarity.
message KnnQuery {
  string field = 1;        // vector field name (e.g. "embedding_v")
  Vector query = 2;        // query vector - dims components, or truncate_dims when set
  int32 k = 3;             // nearest documents (default) or groups to return; must be positive

  // Require exact top-k results by scanning stored vectors. Cost is linear
  // in the number of stored vectors; refine_candidates and ivf are ignored.
  bool exact = 4;

  // Candidate-document pool size for full-precision rescoring of ANN results,
  // in both units. Group search caps the number of candidates per group so
  // repeated keys cannot consume the whole pool. Clamped up to k;
  // 0 selects an adaptive default. Larger pools can improve recall at a cost
  // in memory and latency. Fewer candidates may be available.
  int32 refine_candidates = 5;
  Ivf ivf = 6; // ignored for exact search and segments without an IVF index

  // docs (default): k counts documents. groups: k counts nearest groups under
  // the enclosing top_docs collapse key and missing policy; requires collapse.
  // The match set contains one best scored witness per selected group.
  string unit = 7;

  // Minimum vector similarity for a hit, in the metric's own space (not the
  // transformed score): for l2 the maximum L2 distance (not squared), for ip
  // the minimum dot product, for cosine the minimum cosine similarity. Hits
  // beyond it are dropped from the k nearest, so fewer than k may match.
  // Compared before any enclosing boost. Must be finite; l2 requires >= 0.
  optional float similarity = 8;

  // Search effort for IVF indexes.
  message Ivf {
    // Merge-stable IVF effort: lists to probe if this field were one IVF index
    // with nlist=sqrt(live vectors). 0 = adaptive default; positive values cap
    // search effort.
    int32 nprobe = 1;
    // Minimum fraction of live vectors to scan, in [0,1]. 0 = no floor.
    float min_scan_fraction = 2;
  }
}

// Matches one field. TEXT, STRING, and ID accept string, bytes, numeric, or
// boolean scalar values; numeric and DATE fields accept string or numeric
// scalars. Null matches nothing. Arrays and structured values are rejected,
// and GEO_POINT is unsupported. TEXT values are analyzed and scored; use
// AnyOfQuery for constant-score value sets and MultiMatchQuery, SimpleQuery,
// or ExprQuery for multi-field text.
message Match {
  string field = 1;
  Val val = 2;

  // How to combine the multiple terms an analyzed text field can produce.
  // Unset = OR.
  Operator operator = 3;

  // Minimum number of the analyzed terms that must match (the OR..AND middle
  // ground).  When set it overrides `operator`; clamped to the term count.
  // Mirrors BooleanQuery.min_match.
  int32 min_match = 4;

  // Match TEXT tokens and STRING/ID values regardless of simple Unicode case,
  // after query analysis/normalization. Indexed case variants score as one word,
  // with the query's exact case preferred slightly: frequency weight 1.0 for
  // the analyzed/normalized query token, 0.9 for other variants. Frequencies sum
  // before BM25 saturation, with shared statistics. Slower than a folding
  // variant (_t, _un, _wl), recommended for frequent use. Alternates come from
  // analyzed tokens; case-preserving stemmers can be asymmetric (KStem stems
  // lowercase only). Numeric and DATE fields ignore it.
  bool case_insensitive = 10;

  enum Operator {
    OPERATOR_UNSPECIFIED = 0;  // treated as OR
    OR = 1;                    // a doc matches if any analyzed term matches
    AND = 2;                   // a doc must match every analyzed term
  }
}

// One search field and its weight. TEXT weights scale term frequency and
// length in COMBINED; all other weights multiply the field's score.
// JSON also accepts a bare field name or "name^weight" as shorthand.
message WeightedField {
  string field = 1;
  // Unset = 1. Must be finite and > 0 in every mode.
  optional float weight = 2;
}

// Phrase matching options. A present empty message requests an exact phrase.
message PhraseOptions {
  // Maximum spread of query-adjusted positions. Must be >= 0; unset = 0.
  int32 slop = 1;
}

// Searches one text across weighted fields. In COMBINED mode, TEXT fields
// sharing an analyzer and long-term policy form a group scored as one field
// with BM25F. STRING/ID/numeric/date fields form singleton match groups with
// multiplicative weights. PER_FIELD scores a match in each field separately.
// Group or field scores combine as best + tie * (sum - best), defaulting to
// sum (tie = 1). Values that cannot coerce to a field contribute no clause in
// either mode, including with phrase options; other errors fail the request.
// If no field contributes, matches nothing. BM25F follows Lucene's
// CombinedFieldQuery.
message MultiMatchQuery {
  string text = 1; // the text to analyze or coerce
  // Required and non-empty. Fields resolve through their search bindings.
  // Field order does not matter; duplicate physical targets keep the larger
  // weight. Names containing '*' select indexed TEXT/STRING/ID search targets
  // from concrete declarations and dynamic roots present in reader metadata.
  // Patterns containing '__' select variants; other patterns select roots
  // through their search binding. Declared fields and variants of known roots
  // need not be present in the index. Wildcard lists may resolve to at most 64
  // distinct physical targets, including explicit selectors; exceeding the
  // limit is an error.
  repeated WeightedField fields = 2;
  // Unset = COMBINED.
  Mode mode = 3;

  // How analyzed terms combine. Unset = OR. COMBINED applies this within
  // each group (AND: every term in some field of one group). PER_FIELD
  // applies it within each field (AND: every term in that field). Must be
  // unset when phrase is present.
  Match.Operator operator = 4;

  // Zero uses operator. Positive values override operator and are clamped
  // to the analyzed term count within each group/field. Must be >= 0, and
  // must be zero when phrase is present.
  int32 min_match = 5;

  // Combines matching field/group scores as best + tie * (sum - best).
  // Unset = 1 in every mode. Must be finite and in [0, 1].
  optional float tie = 6;

  // Absent = match. Present = a phrase per TEXT field (requires indexed
  // positions); STRING/ID fields match the whole value, and numeric/date
  // fields still use match coercion. PER_FIELD only; fields combine by tie,
  // and each weight multiplies its field's score. Operator must be unset
  // and min_match must be zero.
  PhraseOptions phrase = 7;

  enum Mode {
    // TEXT weights scale term frequency and document length at every group
    // size. Other fields are singleton groups with multiplicative weights.
    COMBINED = 0;
    // One match or phrase per field; each weight multiplies its score.
    PER_FIELD = 1;
  }
}

// Matches documents that match any query and combines their matching scores
// as best + tie * (sum - best), defaulting to the best score (tie = 0).
// Duplicate queries are kept as separate scoring contributions. A single
// query scores as itself; tie = 1 is a boolean disjunction. Filter use shares
// the equivalent boolean's membership and cache key (Elasticsearch dis_max).
message DisMaxQuery {
  repeated Query queries = 1;  // required, non-empty

  // Weight of the non-best matching queries. Unset = 0. Must be finite and
  // in [0, 1]; 1 adds every score like a boolean disjunction.
  optional float tie = 2;
}

// Constant-score exact value-set membership using the field's value binding.
// TEXT values are analyzed: zero tokens contribute nothing, one token is
// accepted, and multiple tokens are an error. STRING values use the field's
// normalizer; ID values remain verbatim before applying long_terms. Numeric
// and DATE values use the same scalar coercion as ingest.
message AnyOfQuery {
  string field = 1;

  // Required scalar or array of scalars. Null and nested arrays are errors.
  // An empty array matches nothing; duplicate values are ignored.
  Val values = 2;
}

// A query type registered by a compiled-in plugin (see docs/dev/plugins.md).
// The JSON dialect also accepts a registered plugin name as the arm key:
// {"my_query": {"a": 1}} reads as
// {"plugin": {"name": "my_query", "params": {"a": 1}}}, and the expression
// language calls it as my_query(...) with the arguments the plugin declares.
// An unregistered name is a request error that lists the registered query
// types. params are typed JSON values; a nested query is a Query-shaped
// value the plugin parses.
message PluginQuery {
  string name = 1;
  map<string, Val> params = 2;
}

// Matches documents whose field value falls in the given range.  All bounds
// are optional; omit a side for an open-ended range.  Set at most one of
// gte/gt (lower) and at most one of lte/lt (upper); setting both of a pair is
// an error.  With no bounds the query matches every document that has a value
// for the field.  A doc with no value never matches.
//
// Numeric fields (INT/FLOAT/DOUBLE/DATE) require a column. Bounds go
// through the same value-coercion contract as ingest, so querying a literal
// finds the documents ingested with it.  DATE accepts ISO-8601 strings or
// epoch values in the field's unit, and a partial date names its whole window: bounds include the
// granule they name ([2024-01 TO 2024-06] covers January through June;
// exclusive bounds exclude the granule whole).  FLOAT/DOUBLE compare by
// IEEE-754 total order: -0.0 sorts below +0.0 and NaN sorts above +Inf.
//
// Term-backed fields (TEXT/STRING/ID) range over indexed terms in byte order
// (no collation), constant-scoring. TEXT bounds use multi-term normalization
// without tokenization; STRING bounds use the field's normalizer. Exact
// bounds follow the field's long_terms policy. Uses the field's value binding.
message RangeQuery {
  string field = 1;
  Val gte = 2;   // lower bound, inclusive (>=)
  Val gt  = 3;   // lower bound, exclusive (>)
  Val lte = 4;   // upper bound, inclusive (<=)
  Val lt  = 5;   // upper bound, exclusive (<)
}

// Inclusive geographic bounding box in degrees. Bounds are quantized to the
// storage grid exactly like ingest. min_lon > max_lon crosses the dateline;
// min_lat > max_lat is an error. Boxes degenerate at +90 latitude or +180
// longitude match nothing.
//
// Named scalar bounds deliberately avoid positional ambiguity: the VALUE
// array contract [x, y] = [lon, lat] does not apply to this message.
message GeoBoxQuery {
  string field = 1;
  double min_lat = 2; // south edge, degrees in [-90, 90]
  double max_lat = 3; // north edge
  double min_lon = 4; // west edge, degrees in [-180, 180]
  double max_lon = 5; // east edge; min_lon > max_lon crosses the dateline
}

// Geographic distance query with a center in degrees and radius in meters.
// Matches when at least one GEO_POINT value is within the inclusive radius.
//
// Named center scalars deliberately avoid positional ambiguity: the VALUE
// array contract [x, y] = [lon, lat] does not apply to this message.
message GeoDistanceQuery {
  string field = 1;
  double lat = 2;           // center latitude, degrees in [-90, 90]
  double lon = 3;           // center longitude, degrees in [-180, 180]
  double radius_meters = 4; // inclusive radius, finite and non-negative
}

message Filter {
  Query query = 1; // required; restricts matches without contributing to scores

  // Keys in the enclosing TopDocs.ops map that should not receive this filter.
  // The filter still applies to the TopDocs results and other sub-operations.
  // Names must be nonempty, distinct, and present in that ops map. Empty
  // applies the filter to all sub-operations. Not supported on Fusion filters
  // or Fusion source filters.
  repeated string except_ops = 2;
}

message BooleanQuery {
  repeated Query filter = 1;       // required clauses that do not add to the score
  repeated Query required = 2;     // required clauses that do add to the score
  repeated Query optional = 3;     // optional clauses that add to the score
  repeated Query prohibited = 4;   // prohibited clauses that must not match

  // Minimum number of optional clauses that must match.  Unset (0): with any
  // required or filter clause present, optional clauses only rank coincident
  // matches; with only optional clauses, at least one must match.  Setting
  // min_match >= 1 makes the optional group a real constraint alongside
  // required/filter clauses; values above the clause count mean all of them.
  int32 min_match = 5;
}

// Matches documents where `field` has a term starting with `prefix`. TEXT
// fields apply multi-term normalization without tokenization; STRING fields
// apply their normalizer and ID fields use the bytes exactly. An empty prefix
// matches documents that have at least one indexed term for the field.
message PrefixQuery {
  string field = 1;
  string prefix = 2;

  // After whole-prefix normalization, also match simple Unicode case
  // alternates. TEXT fields are supported. Uses a constant-score automaton.
  bool case_insensitive = 3;
}

// Matches an entire indexed term. `*` matches any bytes, `?` matches one
// codepoint, and backslash escapes the next character. On TEXT fields, literal
// characters fold the way the field folds text; `*`, `?`, and escapes are
// syntax and never fold. STRING fields also normalize literal characters;
// ID fields use literals verbatim.
message WildcardQuery {
  string field = 1;
  string pattern = 2;

  // Literal characters, after field folding, also match their simple Unicode
  // case alternates (lower, upper and title forms).
  bool case_insensitive = 3;
}

// Matches an anchored whole indexed term using `|`, concatenation, groups,
// repetition, `.`, and character classes. `^` and `$` are literals. On TEXT
// fields, literal characters fold the way the field folds text; character
// classes and ranges are codepoint-exact. STRING fields also normalize literal
// characters; ID fields use literals verbatim.
message RegexQuery {
  string field = 1;
  string pattern = 2;

  // Literal characters, after field folding, and every member of character
  // classes and ranges also match their simple Unicode case alternates.
  // Negated classes exclude all case forms of their members.
  bool case_insensitive = 3;
}

// Matches indexed terms within byte-wise Levenshtein distance of `term`. TEXT
// fields apply multi-term normalization without tokenization; STRING fields
// apply their normalizer and ID fields use it verbatim. Scoring queries use
// blended BM25 statistics; filter queries use constant scores.
message FuzzyQuery {
  string field = 1;
  string term = 2;

  // Maximum edit distance, 0..2. Unset = AUTO by term length:
  // 0 for <=2 bytes, 1 for <=5, else 2.
  optional int32 max_edits = 3;

  // Leading bytes that must match exactly. Unset = 1; 0 = no required prefix.
  optional int32 prefix_length = 4;

  // Max term expansions, closest terms first. Unset/0 = default 50. A
  // positive value requests that cap; the operator/clause budget may lower it
  // with a warning. Negative values are rejected.
  int32 max_expansions = 5;
}

message PhraseQuery {
  string field = 1;

  // Set exactly one of these.
  string text = 2;               // un-analyzed text that should yield multiple words when analyzed. ex: "Thomas Anderson"
  repeated string words = 3;     // un-analyzed list of words. ex: ["Yonik","Seeley"]
  repeated string terms = 4;     // analyzed list of terms as strings
  repeated bytes terms_bin = 5;  // analyzed list of binary (raw bytes) terms

  // Maximum spread of rebased positions: max(docPos-queryPos) minus
  // min(docPos-queryPos). Must be nonnegative. Adjacent transposition costs
  // 2; this is not the number of words between terms. Zero is exact.
  int32 slop = 6;
  repeated int32 positions = 15; // optional positions of the terms
}

// An expression in the Luxir query language, with strict syntax and precise
// parse errors. Raw search-box input can use SimpleQuery. Expressions have
// structured Query equivalents and use the same field analysis rules.
//
// Syntax summary: field:value, field:"a phrase" (or '...'), field:(grouped
// boolean scope), AND / OR / NOT with real precedence (NOT > AND > OR),
// +required / -prohibited prefixes (may not mix with AND/OR at one level),
// ranges field:[a TO b] / {a TO b} and comparisons field:>=v, trailing * for
// prefix, term~N for fuzzy (bare ~ = auto), *:* matches everything, and the
// function form name(main value, arg=value, ...) reaching the callable query
// types by their JSON names (kNN and geo queries require structured
// messages). $name references a value bound in `vars`. Unfielded bare words
// are a parse error.
message ExprQuery {
  string q = 1;  // the expression

  // Values referenced from the expression as $name.  Bound as VALUES (never
  // re-parsed as syntax), so end-user input is safe to pass through:
  // {"q": "simple_query($input, fields=[title])", "vars": {"input": ...}}.
  map<string, Val> vars = 2;
}

// Forgiving end-user query for raw search-box input. Malformed query text
// degrades to a valid query. Reported degradations appear in SearchResponse.warnings.
//
// Syntax: bare words (searched across `fields`), + (the NEXT clause is
// required; needs a preceding clause to combine with, so a leading + is
// inert), -word (must not; under the default OR this is its own
// all-except-word clause - restrictive negation needs operator AND),
// a | b (or), "a phrase", (grouping), trailing * (prefix), word~N (fuzzy;
// bare ~ = auto edits), \ escapes the next character, and field:value /
// field:"a phrase" fielded terms.  A colon token whose field name is not
// queryable degrades to literal text against `fields`.
message SimpleQuery {
  string q = 1;  // the raw user input

  // The fields unfielded (bare) terms search; scores sum across fields.
  // Required and non-empty. Invalid request parameters can cause errors even
  // though malformed q text is tolerated.
  repeated string fields = 2;

  // How adjacent clauses combine.  Unset = OR (any clause may match).
  Match.Operator operator = 3;

  // Minimum number of top-level optional clauses that must match (mirrors
  // BooleanQuery.min_match).  Silently inapplicable when the parsed top
  // level cannot honor it (a single clause, required clauses from + or the
  // AND operator).
  int32 min_match = 4;

  // Narrows which field names the field:value syntax may reach.  Empty =
  // every queryable schema field.  It can only narrow that set - listing a
  // name the schema cannot query does not make it work.  A field: token
  // outside the allowed set is literal text, never an error.
  repeated string allowed_fields = 5;
}


// How facet selections filter the enclosing TopDocs results and its
// sub-operations. Nonempty selected is supported only on facets directly in
// TopDocs.ops. Selections on different facets combine with AND. Domain
// overrides can discard these filters; see Domain.apply_parent_filters.
enum SelectionMode {
  ANY = 0; // match any selected value; omit this selection's filter from its own facet

  // Require every selected value. Keep this selection's filter on its own
  // facet so each unselected bucket counts matches if that value is added.
  ALL = 1;
}

// Buckets of distinct field values, using the field's value binding.
// STRING/ID support sub-operations and custom sorts. INT/DATE/TEXT support
// counts, limits, mincount, missing, and selections.
message FieldFacet {
  enum CountUnit {
    DOCS = 0; // Count documents.
    GROUPS = 1; // Distinct keys of the nearest enclosing collapsed list.
  }
  string field = 1;

  // Maximum ordinary buckets. Unset = 5; 0 = none; -1 = all.
  // Selected buckets outside the ordinary page are appended after it.
  optional sint64 limit = 2;

  // Minimum bucket count. Unset includes only buckets with matches.
  // STRING/ID/TEXT also accept 0 to include indexed terms absent from the domain.
  // INT/DATE require a positive value when set.
  optional int64 mincount = 3;
  bool missing = 4; // Return the count without a value, in the chosen count unit.

  // One metric sub-operation name. Unset sorts by count
  // descending, then bucket value ascending.
  repeated SortSpec sort = 5;
  map<string, SearchOp> ops = 6;  // sub-facets or search operations performed per bucket

  // Scalar or array of selected values, coerced as AnyOfQuery values. Selected
  // buckets missing from the ordinary page append in input order with exact
  // counts, even below mincount or absent from the index. Null is an error.
  Val selected = 7;
  SelectionMode selection_mode = 8; // ALL requires a nonempty selection

  // Unset inherits a parent facet's measure, or counts groups beneath a
  // collapsed list; entering group ops defaults to docs. Explicit GROUPS uses
  // the nearest enclosing collapse, including inside a group. Controls count,
  // count order, mincount, and missing; metrics still fold documents.
  optional CountUnit count_unit = 9;
  // Exact distinct keys per bucket, also usable without collapse. Same key
  // types and missing policies as Collapse. Conflicting measures are errors.
  Collapse count_distinct = 10;
}

message CalendarGap {
  int32 n = 1; // number of civil units per bucket; must be positive
  enum Unit {
    UNKNOWN = 0;
    DAY = 1;
    WEEK = 2;
    MONTH = 3;
    QUARTER = 4;
    YEAR = 5;
  }
  Unit unit = 2;
}

// Numeric or DATE buckets using the field's value binding. Each bucket is
// inclusive at its lower bound and exclusive at its upper bound; the final
// bucket is clipped to end under EXPLICIT bounds. start must be less than end
// when both are supplied. Buckets return in lower-bound order. At most 100000
// buckets may be generated; with sub-operations at most 1024 may be returned
// after mincount filtering. Fixed DATE gaps step in local time in the facet zone:
// both fold occurrences are fences; skipped lattice times map to the transition.
message RangeFacet {
  string field = 1;
  // EXPLICIT: inclusive first fence, required. DATA: optional widening bound;
  // include its cell without excluding smaller matching values.
  Val start = 2;
  // EXPLICIT: exclusive last fence, required. DATA: optional exclusive widening
  // bound; include intersecting cells below it without excluding larger values.
  Val end = 3;
  oneof gap_kind {
    Val gap = 4; // positive fixed width in field units; integer field units for DATE
    CalendarGap calendar_gap = 10; // civil gap for DATE fields only
  }
  optional int64 mincount = 5; // minimum bucket count; unset = 0; must be >= 0
  bool missing = 6; // Return the count without a value, in the chosen count unit.
  map<string, SearchOp> ops = 8;  // sub-facets or search operations performed per bucket
  string time_zone = 9; // empty inherits SearchRequest.time_zone; DATE fields only

  // Scalar or array naming generated bucket lower bounds. Selected buckets
  // are returned even below mincount. Null, nongenerated bounds, and duplicate
  // bounds after coercion are errors. Not supported with DATA bounds.
  Val selected = 11;
  SelectionMode selection_mode = 12; // same filtering rules as FieldFacet; see SelectionMode
  optional FieldFacet.CountUnit count_unit = 13; // Inherits the parent measure; GROUPS uses the nearest collapse.
  Collapse count_distinct = 14; // Exact distinct keys; same specification as Collapse.

  // Whether the extent is explicit or derived from this facet instance's values.
  enum Bounds {
    // start and end are required. Fixed DATE grids use the local time of start
    // as their phase; calendar grids step from start for every n. The last
    // fence is clipped to end.
    EXPLICIT = 0;
    // Span the smallest through largest matching finite values, plus optional
    // start/end widening. Queries, filters and deletions affect the extent;
    // each parent bucket's child histogram has its own span. Occupancy is from
    // raw values, even when a distinct key is dropped and its measured count
    // is zero. Empty domains return no buckets unless both widening bounds
    // supply a span. NaN/Inf are outside every bucket and never fail DATA.
    // Calendar grids use the 1970 civil epoch (ISO weeks: Monday 1969-12-29);
    // a civil day starts at its first midnight, or first valid instant.
    // selected is unsupported. The 100000-bucket cap applies to the actual
    // span including widening and empty interior cells; use a larger gap.
    DATA = 1;
  }
  Bounds bounds = 15;

  // DATA fixed gaps only; rejected with calendar_gap. Default 0. For INT,
  // FLOAT and DOUBLE, fences are origin + k * gap from a global integer k.
  // For DATE, origin is a wall-clock phase in the facet zone: 21600000 with
  // gap 86400000 starts days at 06:00 local across DST. This differs from
  // Elasticsearch's UTC-translated offset near transitions. Must be integer
  // field units for DATE, an integer for INT, or a number for FLOAT/DOUBLE.
  Val origin = 16;
}

message QueryBucket {
  string name = 1; // nonempty output label and selection key; unique within the facet
  Query query = 2; // required; the bucket predicate
}

// Named query buckets. A document may contribute to more than one bucket.
message QueryFacet {
  repeated QueryBucket buckets = 1; // required, nonempty; response order = request order
  map<string, SearchOp> ops = 6; // sub-ops per bucket
  Val selected = 7; // bucket name or array of distinct existing names; null is an error
  SelectionMode selection_mode = 8; // same filtering rules as FieldFacet; see SelectionMode
  optional FieldFacet.CountUnit count_unit = 9; // Inherits the parent measure; GROUPS uses the nearest collapse.
  Collapse count_distinct = 10; // Exact distinct keys; same specification as Collapse.
}

// Overrides an operation's incoming document set, including beneath facet
// and group buckets. A reset retains the enclosing structural identities,
// and re-evaluates selection-query identities outer to inner in the new
// scope; child membership can differ from the parent's counted window.
// Not supported directly in Fusion.ops.
message Domain {
  // If present, replaces the incoming domain with this query's matches
  // within live documents and the enclosing structural bucket identities.
  // If absent, inherits the incoming domain.
  Query query = 2;

  // With query set, reapply the owning list's filters, including facet
  // selections, while respecting except_ops. Default false discards them.
  // Requires query; does not restore matching queries above this operation.
  optional bool apply_parent_filters = 3;

  // Additional non-scoring constraints, ANDed with the inherited or reset
  // domain. Entries and query must each specify a query kind.
  repeated Query filter = 5;
}

// A nonfatal degradation reported by the query parser or engine. Documented
// defaults, ignored parameters, and clamps need not produce warnings.
message Warning {
  string code = 1;     // stable machine key, e.g. "fuzzy_clamped", "field_narrowed"
  string message = 2;  // human-readable detail
}

// A failure.  The same shape everywhere an error appears: SearchResponse.error,
// UpdateResponse.error and its per-document errors, the HTTP error body, and
// gRPC status details.  kind is the coarse class: it selects the HTTP status
// and gRPC status code, and tells a client whether to fix the request, the
// target, or retry, without knowing the code.  code is the stable machine key
// (snake_case, like Warning.code); new codes appear under existing kinds
// without changing this shape.  message is human detail, not a contract.
message Error {
  enum Kind {
    UNKNOWN = 0;
    INVALID_REQUEST = 1;      // the request as written cannot be served (HTTP 400)
    NOT_FOUND = 2;            // the addressed collection or route does not exist (404)
    ALREADY_EXISTS = 3;       // the request would create what already exists (409)
    FAILED_PRECONDITION = 4;  // the node's state forbids the operation, e.g. --read-only (403)
    RESOURCE_EXHAUSTED = 5;   // a size or memory ceiling was exceeded (429; 413 for request_too_large)
    UNAVAILABLE = 6;          // the target exists but cannot serve now: shutting down, being deleted, failed to load (503)
    INTERNAL = 7;             // a server-side failure the request did not cause (500)
  }
  Kind kind = 1;
  string code = 2;
  string message = 3;
}

// Execution details for instrumented operations. STRING/ID field facets
// provide profiles; other operations may be absent from this list.
message ExecutionProfile {
  repeated ExecutionProfileOp ops = 1;
}

message ExecutionProfileOp {
  string name = 1;
  repeated ExecutionProfilePiece pieces = 2;
}

// Execution details for one segment of an operation.
message ExecutionProfilePiece {
  string kind = 1; // "segment"
  int32 segment = 2;
  int32 max_doc = 3;
  string strategy = 4;
  optional sint64 cardinality = 5;
  optional sint64 domain_size = 6;
  int64 thread_id = 7;
  uint64 elapsed_us = 8;

  // Human-readable execution notes. Contents and formatting may change;
  // do not parse these entries.
  repeated string details = 9;
}

// Top-level response to a Search request
message SearchResponse {
  string commit = 7; // token of the reader used for this response
  string request_id = 1;
  map<string, Val> ops = 2; // the results of the search operations in the request, keyed by operation name.

  // Present on a failed request's final response; ops is then empty.
  // A final error may follow earlier result batches.
  Error error = 3;
  repeated Warning warnings = 4; // final response only, on success or failure
  ExecutionProfile profile = 5; // final response only, when SearchRequest.profile is true
  bool more = 15;  // if true, expect at least one more streaming response to the logical request.
}


// Typed collapse identity. Component types follow the resolved schema fields.
message GroupComponent {
  enum Type { STRING = 0; ID = 1; INT = 2; DATE = 3; } // INT carries signed int64 values.
  Type type = 1;
  oneof value {
    google.protobuf.NullValue null = 2;
    string s = 3;
    sint64 i = 4;
  }
}
message GroupKey {
  repeated GroupComponent component = 1;
  // Present for missing=expand: reader-local document identity, not a key value.
  optional uint64 singleton = 2;
}

// Columns aligned with a collapsed list's returned rows. Absent columns were not requested.
message GroupTable {
  repeated GroupKey keys = 1;
  repeated sint64 counts = 2;
  // Metric sort values, or list rank values when head_sort chooses another member.
  repeated ArrVal ranks = 3;
  // Each operation is an array aligned with keys, as in FacetResult.ops.
  map<string, Val> ops = 4;
}

// A batch of returned documents.  Document i is the merge of columns row i
// and docs[i]; all-columns (docs absent) and all-docs (columns empty) are
// just the degenerate cases.  Which fields land where follows the request's
// DocFormat; under COLUMNS an all-missing discovered column is left out of
// the batch, under ADAPTIVE placement is per batch and field.
message DocList {
  // Match count when count_limit is nonzero. Counts groups with
  // collapse; otherwise Fusion counts source-union documents before paging.
  optional sint64 found = 1;
  // True when found is a lower bound; false means the count is exact.
  bool found_gte = 9;
  optional sint64 found_docs = 2; // Collapse only, when count_limit is nonzero, after missing=drop.
  optional sint64 found_groups = 8; // Diversify only, with nonzero count_limit: distinct eligible keys.
  GroupTable groups = 7; // Collapse only: complete metadata aligned with this batch's rows.

  // Dense columns; each has exactly row_count slots.
  map<string, Column> columns = 3;

  // Per-document field maps.  When present: exactly row_count entries;
  // docs[i] holds the fields of document i not represented as a dense
  // column.  A field name never appears in both columns and docs[i].
  repeated Map docs = 5;

  // Number of documents in this batch, including rows with no returned fields.
  // A count-only response has row_count=0.
  int32 row_count = 6;

  int64 offset = 4;
  map<string, Val> ops = 14; // sub-operation results performed on the TopDocs query.
  bool more = 15; // true if this document list has more batches; see SearchResponse.more
}


message FacetResult {
  Column bucket_ids = 2;
  repeated int64 counts = 3;
  optional int64 missing = 4; // the number of documents that do not have this field
  map<string, Val> ops = 22;  // sub-operation results performed per bucket, like a sub-facet or statistics.
  int64 offset = 6;
}

//
//  Indexing
//

// Parameters governing how a commit is performed.  Presence of this message in an
// UpdateRequest indicates the request should commit; absence means no commit.
message CommitParams {
  // Commit deadline in milliseconds. 0 (default) commits before responding;
  // a positive value schedules a deferred commit and responds without waiting.
  // Deferred requests coalesce at the earliest outstanding deadline. An
  // explicit commit also satisfies outstanding deadlines. max_segments,
  // build_aux_indexes, or wait_for_merges force an immediate commit instead.
  // Search visibility also depends on SearchRequest.freshness_ms.
  uint64 commit_within_ms = 1;

  // Build missing aux overlays as part of this commit. An overlay already
  // present on a segment is retained rather than rebuilt.
  //   []                 - request no aux builds
  //   ["*"]              - build every eligible missing vector overlay
  //   ["vec.title_v"]     - build the missing vector overlay for title_v
  // Only "*" and exact overlay names are supported; no partial-name patterns.
  repeated string build_aux_indexes = 2;

  // If true, this commit will wait for any in-flight merges to finish before publishing.
  bool wait_for_merges = 3;

  // Merge down so the data visible at this commit resides in at most this many
  // segments. 0 (default) = no forced merging. The response is not sent until
  // the merged index is durably published: at return, everything this commit
  // made visible lives in <= max_segments segments (concurrent ingestion after
  // this commit may add new segments; they are not covered by the promise).
  // The response waits for the merged layout even when commit_within_ms is
  // positive.
  uint32 max_segments = 4;

  // Forces an immediate commit. All captures
  // live followers at commit completion; members that go non-live stop counting.
  ReplicaRequirement wait_for_replicas = 5;
  // Visibility wait deadline. Absent defaults to 30000; timeout never undoes commit.
  optional uint64 wait_for_replicas_timeout_ms = 6;
}

// Exactly one requirement is required, including an explicit count of zero.
message ReplicaRequirement {
  oneof kind {
    uint32 count = 1;
    AllReplicas all = 2;
  }
}
message AllReplicas {}

message ReplicaResult {
  enum Outcome {
    SATISFIED = 0;
    TIMED_OUT = 1;
    CANCELLED = 2;
  }
  // For "all", wanted excludes captured followers that are no longer live.
  optional uint32 wanted = 1;
  optional uint32 serving = 2;
  optional Outcome outcome = 3; // independent of local commit success
}

message CollectionCommit {
  // Durable snapshot identity, retained even if the replica wait fails.
  string commit = 1;
  ReplicaResult replicas = 2;
  // Local commit failure for this collection.
  Error error = 3;
}

// Index or delete documents, with an optional commit.
message UpdateRequest {
  // Optional opaque identifier, echoed in the response for correlation.
  string request_id = 1;

  string collection = 3; // empty selects the default collection, "main"

  // Documents to index. Input fields named _version_ after field mapping are
  // rejected with a document error: the field is assigned by the engine and
  // optimistic concurrency is not supported.
  repeated Map docs = 4;

  // Document IDs to delete.  Deletes never fail per-id; deleting a nonexistent id
  // is a no-op.
  repeated string delete_ids = 6;

  // Skip overwrite/dedupe for faster indexing when incoming IDs are known to be
  // unique and do not already exist in the collection.
  // Default (false) overwrites any existing document with the same ID.
  bool allow_dups = 7;

  // If true, all documents in this request must be successfully indexed or none will be.
  // Processing stops at the first failing document: documents already indexed by this
  // request are rolled back, queued delete_ids from this request are rolled back, and
  // later documents are not attempted (and not listed in errors).
  // Atomicity is per-request; it does not span multiple requests in a stream.
  bool all_or_none = 8;

  // If true, return the ids of indexed documents in the response.
  bool return_ids = 9;

  // Commit parameters.  If present, this request will commit; if absent, no commit is performed.
  CommitParams commit = 10;

  // Renames input document keys onto schema fields for this request's docs, applied
  // before schema lookup: a doc key found in the map indexes under the mapped name.
  // An entry mapping to "" drops that input key.  After mapping, a name appearing
  // more than once in a doc keeps the last occurrence (the same last-wins rule as
  // duplicate keys).  Keys not in the map index under their own name unless
  // drop_unmapped is set.  This reshapes a foreign document stream per request,
  // without editing the input or the schema.
  map<string, string> field_map = 11;

  // If true, doc keys not present in field_map are dropped instead of indexed.
  // Requires a non-empty field_map (note "id" is dropped too unless mapped).
  bool drop_unmapped = 12;
}

// The response to an update request.  In streaming mode the server sends exactly one
// response per request.
message UpdateResponse {
  // This is the request_id from the UpdateRequest, if it was set.
  string request_id = 1;

  // The update version assigned to the update request.
  uint64 update_version = 2;

  enum Status {
    UNKNOWN = 0;          // the default
    OK = 1;               // the update was successful
    PARTIAL = 2;          // part of the request took effect, part failed (see errors)
    // The request failed. If error is unset, the failure was per-document (see
    // errors) and the request had no visible effect on the index. If error is
    // set, the failure was request-level (e.g. commit pipeline) and the effect
    // of individual documents is indeterminate beyond what errors lists.
    ERROR = 3;
  }

  Status status = 3;

  // ids of documents that were successfully indexed, if return_ids was set to true in the
  // request.  In request order; failed documents are omitted (align against docs by
  // skipping errors[].index).  A successfully indexed doc without a string/bytes id
  // contributes an empty string.  Only meaningful when status is OK or PARTIAL; on a
  // request-level ERROR the listed documents may have been rolled back.
  repeated string ids = 4;

  message DocError {
    // the id of the failed document as given in the request (empty if absent or not a
    // string/bytes value)
    string id = 1;

    // position of the failed document within the request's document list
    int32 index = 2;
    Error error = 3;
  }

  // Per-document failures.  A failed document has no effect on search results; the
  // previous version of the document, if any, is untouched.
  repeated DocError errors = 5;

  // Number of failed documents.  Equals the length of errors unless the transport
  // retained only a prefix (the NDJSON stream keeps the first 100 per group).
  int64 total_errors = 7;

  // Request-level failure (not tied to a single document), e.g. a failure in the commit
  // pipeline.  Set exactly when status == ERROR for a non-document failure.
  Error error = 6;

  // Resulting snapshot identity; absent without a completed commit.
  // Snapshot token: incarnation:index_gen.
  string commit = 8;
  ReplicaResult replicas = 9;
  // NDJSON URL EOF commit outcomes, including for a single collection.
  // Any collection error sets the response status to ERROR and a top-level error;
  // every admitted collection outcome is retained. HTTP status remains 200.
  map<string, CollectionCommit> commits = 10;
}




message Map {
  // Unordered map of dynamically typed values.
  map<string, Val> fields = 1;
}

message Val {
  oneof kind {
    // Represents a null value.
    google.protobuf.NullValue null = 1;
    string s = 2;
    sint64 i = 3;
    double d = 4;
    float f = 5;
    bool b = 6;
    bytes bin = 7;
    Map map = 8;
    ArrVal arr = 9;
    ArrStr arr_s = 10;
    ArrInt arr_i = 11;
    ArrFloat arr_f = 12;
    ArrDouble arr_d = 13;
    ArrBin arr_bin = 14;
    Vector vec = 15;              // single dense vector (single-valued vector field, or one element)
    ArrVector arr_vec = 16;       // list of vectors (multi-valued vector field per doc)
    DocList docs = 100; // a list of documents, used for search results
    FacetResult facet = 101; // result of a facet operation
  }
}

message ArrVal {
  // Repeated field of dynamically typed values.
  repeated Val v = 1;
}

message ArrStr {
  repeated string v = 1;
}

message ArrInt {
  repeated sint64 v = 1;
}

message ArrFloat {
  repeated float v = 1;
}

message ArrDouble {
  repeated double v = 1;
}

message ArrBin {
  repeated bytes v = 1;
}

// One array per document, used in columns for multi-valued string fields.
message ArrArrStr {
  repeated ArrStr v = 1;
}

message ArrArrInt {
  repeated ArrInt v = 1;
}

message ArrArrFloat {
  repeated ArrFloat v = 1;
}

message ArrArrDouble {
  repeated ArrDouble v = 1;
}

// A dense vector value. Dimensionality is the number of elements in f32.v.
message Vector {
  oneof kind {
    ArrFloat f32 = 1;
  }
}

// A list of vectors, used as a per-doc cell for multi-valued vector fields.
message ArrVector {
  repeated Vector v = 1;
}

message ColStr {
  // "" unless a real empty string occurs in the batch, in which case a
  // string greater than every batch value is used (see the
  // ColInt.missing_val sentinel note; the check is exact).
  string missing_val = 1;
  repeated string v = 2;
}

// One slot per document, including missing values, aligned with DocList rows.
// Scalar columns use missing_val; multi-valued columns use empty arrays.
// Vector and value columns use the missing-value rules described on their
// fields.  Every returned field type has a column form: a type with no typed
// arm uses col_val.
message Column {
  oneof kind {
    ColStr col_s = 1;
    ColInt col_i = 2;
    ColFloat col_f = 3;
    ColDouble col_d = 4;
    ArrArrStr multi_s = 5;
    ArrArrInt multi_i = 6;
    ArrArrFloat multi_f = 7;
    ArrArrDouble multi_d = 8;
    ColVal col_val = 9;        // any other value type: one Val per doc; missing = unset kind

    ColVector col_vec = 16;    // single-valued vector column: one Vector per doc; missing = unset oneof
    MultiVector multi_vec = 17; // multi-valued vector column: one ArrVector per doc; missing = empty list
  }
}

// Single-valued vector column.  Each Vector slot is independently nullable
// via its empty oneof - no separate missing_val needed.
message ColVector {
  repeated Vector v = 1;
}

// Column of a field type that has no typed arm (an object, an interval, a
// boolean): v[i] holds what document i's row entry would.  An unset kind
// means missing.
message ColVal {
  repeated Val v = 1;
}

// Multi-valued vector column.  Empty ArrVector means "doc does not have the
// field"; absence is indistinguishable from an empty list, which matches the
// indexing behavior (an empty list of vectors is not stored).
message MultiVector {
  repeated ArrVector v = 1;
}

message ColInt {
  // Sentinel for documents without a value. Chosen per column per batch so
  // it never equals a present value: v[i] == missing_val means missing.
  // HTTP JSON represents missing values as null.
  sint64 missing_val = 1;
  repeated sint64 v = 2;
}

message ColFloat {
  // Chosen per batch like ColInt.missing_val (the check is exact).  Never
  // NaN (it compares unequal to itself); +0.0/-0.0 are treated as one value
  // when choosing.
  float missing_val = 1;
  repeated float v = 2;
}

message ColDouble {
  // See ColFloat.missing_val.
  double missing_val = 1;
  repeated double v = 2;
}

message CreateCollectionRequest {
  string name = 1;
  SchemaDef schema = 2;
  // Administration only: the owning tenant. Empty is the caller's tenant
  // (the default tenant until credentials carry one).
  string tenant = 3;
  // All counts live followers subscribed to the tenant that serve any
  // collection, since none serves the new one yet.
  ReplicaRequirement wait_for_replicas = 4;
  optional uint64 wait_for_replicas_timeout_ms = 5; // absent = 30000
}

message CreateCollectionResponse {
  string commit = 2; // exact snapshot published by creation
  string name = 1;
  ReplicaResult replicas = 3;
}

message DeleteCollectionRequest {
  string name = 1;
  string tenant = 2; // as CreateCollectionRequest.tenant
}

message DeleteCollectionResponse {
  string name = 1;
}

// Names of every collection of one tenant, sorted. HTTP-only: GET or POST
// /collections/_list (also GET /collections) for the caller's tenant, or
// /tenants/{tenant}/collections/_list.
message ListCollectionsResponse {
  repeated string collections = 1;
}

// Tenants that own at least one collection, sorted. HTTP-only: GET /tenants.
message ListTenantsResponse {
  repeated string tenants = 1;
}

// Which statistics to gather. The node scope (no collection, no tenant) always
// returns the cheap counters: service activity and node memory, read from
// atomics and allocator statistics. Anything that walks collections, lists
// directories, or reads the operating system is opt-in. A tenant or a
// collection scope always walks its collections and returns no node blocks.
message StatsRequest {
  reserved 4;
  reserved "memory";
  // Empty selects every collection of `tenant`, or of every tenant when
  // `tenant` is also empty (administration).
  string collection = 1;
  // Per-segment records. Implies `files`, and `collections` at node scope.
  bool segments = 2;
  // Administration only. With a collection, empty is the caller's tenant.
  string tenant = 3;
  // Node scope: also walk every collection (totals, index state, query cache,
  // snapshot pins, inverters). Takes each writer's index lock briefly; no
  // file I/O. Implied by a tenant or collection scope.
  bool collections = 5;
  // Also list index directories, filling the `bytes` totals, segment bytes and
  // aux index bytes. Implies `collections` at node scope.
  bool files = 6;
  // Node scope only: this process, the data directory's filesystem and the
  // process's cgroup v2, read from procfs and cgroupfs (Linux only).
  bool system = 7;
  // Node scope only: host-wide CPU, memory, network, TCP, disk and pressure
  // statistics from procfs (Linux only), which node_exporter also reports.
  // Inside a container most of them describe the host, not the container.
  bool host = 8;
}

message StatsResponse {
  reserved 3, 6, 7;
  reserved "indexing_ram", "storage_ram", "big_buffer_ram";
  // Set when collections are walked.
  StatsTotals totals = 1;
  repeated CollectionStats collections = 2;
  uint64 multiterm_expansion_refills = 8;
  // Node scope only.
  MemoryStats memory = 9;
  // Node scope only.
  ServiceStats service = 10;
  // Set by StatsRequest.system.
  SystemStats system = 11;
  // Set by StatsRequest.host.
  HostStats host = 15;
  // Time spent gathering this response, excluding serialization.
  double duration_seconds = 13;
  // Node-wide checksum scrub counters; set when store.scrub-interval-s is.
  ScrubStats scrub = 14;
}

// Cumulative duration histogram. counts[i] is the number of observations at or
// below bound i of the histogram's family (ServiceStats.request_duration_bounds
// or background_duration_bounds); the last entry (+Inf) equals count. counts is
// empty when count is zero.
message HistogramStats {
  repeated uint64 counts = 1;
  double sum = 2;  // seconds
  uint64 count = 3;
}

// One kind of work: currently running, completed by outcome, and the duration
// of completed work (failed and cancelled work included).
message ActivityStats {
  int64 in_flight = 1;
  uint64 ok = 2;
  uint64 error = 3;
  uint64 cancelled = 4;
  HistogramStats duration = 5;
}

// Request traffic on one transport. Replication routes are not counted.
message TransportStats {
  // Keyed by operation: search, update, schema, collections, stats, health, other.
  map<string, ActivityStats> operations = 1;
  // Failed requests or calls, keyed by the kind of their first error. A
  // request fails when the transport fails, its response carries a
  // whole-request error, or its stream ends in failure.
  map<string, uint64> errors = 2;
  uint64 received_bytes = 3; // application payload, excluding transport framing
  uint64 sent_bytes = 4;     // application payload submitted for sending
  uint64 stream_pauses = 5;  // response producers paused by flow control
  uint64 connections = 6;    // HTTP only: live sessions, including idle keep-alive
  int64 io_threads = 7;      // HTTP only: running connection shard threads
}

// Process-wide service counters since start. Counters reset on restart and
// cache-control reset_counters does not touch them.
message ServiceStats {
  string version = 1;
  // The CPU target the binary was built for.
  string cpu_target = 20;
  bool read_only = 2;
  // Upper bounds, in seconds, of the request, search execution and index batch
  // histograms.
  repeated double request_duration_bounds = 3;
  // Upper bounds, in seconds, of the flush, commit, delete pass, merge,
  // vector build and reader refresh histograms.
  repeated double background_duration_bounds = 4;
  TransportStats http = 5;
  TransportStats grpc = 6;
  // Searches the engine accepted, from submission to the final response. A
  // gRPC Search call can carry many, so this is the per-search view there.
  ActivityStats search = 21;
  // Search body execution, excluding scheduler waits and streaming drains.
  HistogramStats search_execution = 7;
  uint64 search_resource_exhausted = 8;
  uint64 search_warnings = 9;
  ActivityStats index_batches = 10;
  // Accepted into indexing (not durably acknowledged) or rejected/rolled back.
  uint64 documents_accepted = 11;
  uint64 documents_rejected = 12;
  uint64 delete_ids_accepted = 13;
  // Documents rejected with an error of their own, keyed by error kind. The
  // rest of documents_rejected were rolled back with a failed batch.
  map<string, uint64> document_errors = 19;
  ActivityStats flush = 14;
  ActivityStats commit = 15;
  // Delete passes, which apply deletes between commits without flushing,
  // syncing or publishing.
  ActivityStats delete_pass = 22;
  ActivityStats merge = 16;
  ActivityStats vector_build = 17;
  ActivityStats reader_refresh = 18;
}

// This process, its data filesystem and its cgroup. Collectors that read their
// sources are listed in `available`; the others in `unavailable`, with their
// fields omitted.
message SystemStats {
  ProcessStats process = 1;
  ProcessIoStats process_io = 6;
  // The data directory's filesystem; set only for the fs store backend.
  FilesystemStats filesystem = 2;
  CgroupStats cgroup = 3;
  repeated string available = 4;
  repeated string unavailable = 5;
}

// Host-wide statistics, as node_exporter reports them. Collectors are listed
// as in SystemStats.
message HostStats {
  HostCpuStats cpu = 1;
  HostMemoryStats memory = 2;
  repeated NetworkInterfaceStats network = 3;
  TcpStats tcp = 4;
  repeated DiskStats disks = 5;
  repeated PressureStats pressure = 6;
  repeated string available = 7;
  repeated string unavailable = 8;
}

message ProcessStats {
  uint64 resident_bytes = 1;
  uint64 virtual_bytes = 2;
  uint64 swap_bytes = 3;
  uint64 resident_anonymous_bytes = 4;
  uint64 resident_file_bytes = 5;
  uint64 resident_shared_bytes = 6;
  uint64 resident_peak_bytes = 7;
  uint64 threads = 8;
  double cpu_seconds = 9;
  uint64 voluntary_context_switches = 10;
  uint64 involuntary_context_switches = 11;
  uint64 minor_page_faults = 12;
  uint64 major_page_faults = 13;
  int64 max_fds = 14; // soft limit; -1 is unlimited
  uint64 open_fds = 15;
  double start_time_seconds = 16; // since the Unix epoch
}

// This process's I/O accounting (/proc/self/io).
message ProcessIoStats {
  uint64 disk_read_bytes = 1;
  uint64 disk_written_bytes = 2;
  uint64 io_read_bytes = 3;
  uint64 io_written_bytes = 4;
  uint64 io_read_calls = 5;
  uint64 io_write_calls = 6;
}

message CpuTimes {
  string cpu = 1;
  double user = 2; // seconds; includes guest time
  double nice = 3;
  double system = 4;
  double idle = 5;
  double iowait = 6;
  double irq = 7;
  double softirq = 8;
  double steal = 9;
}

message HostCpuStats {
  repeated CpuTimes cpus = 1;
  uint64 context_switches = 2;
  uint64 forks = 3;
  uint64 procs_running = 4;
  uint64 procs_blocked = 5;
  double boot_time_seconds = 6;
  double load1 = 7;
  double load5 = 8;
  double load15 = 9;
  uint64 filefd_allocated = 10;
  uint64 filefd_maximum = 11;
}

// Host memory from /proc/meminfo and VM events from /proc/vmstat.
message HostMemoryStats {
  uint64 total_bytes = 1;
  uint64 free_bytes = 2;
  uint64 available_bytes = 3;
  uint64 buffers_bytes = 4;
  uint64 cached_bytes = 5;
  uint64 swap_cached_bytes = 6;
  uint64 swap_total_bytes = 7;
  uint64 swap_free_bytes = 8;
  uint64 dirty_bytes = 9;
  uint64 writeback_bytes = 10;
  uint64 mapped_bytes = 11;
  uint64 shmem_bytes = 12;
  uint64 slab_bytes = 13;
  uint64 slab_reclaimable_bytes = 14;
  uint64 slab_unreclaimable_bytes = 15;
  uint64 page_tables_bytes = 16;
  uint64 kernel_stack_bytes = 17;
  uint64 anon_pages_bytes = 18;
  uint64 page_faults = 19;
  uint64 major_page_faults = 20;
  uint64 swap_in_pages = 21;
  uint64 swap_out_pages = 22;
  uint64 oom_kills = 23;
}

// One interface in this network namespace (/proc/net/dev).
message NetworkInterfaceStats {
  string device = 1;
  uint64 receive_bytes = 2;
  uint64 receive_packets = 3;
  uint64 receive_errs = 4;
  uint64 receive_drop = 5;
  uint64 receive_fifo = 6;
  uint64 receive_frame = 7;
  uint64 receive_compressed = 8;
  uint64 receive_multicast = 9;
  uint64 transmit_bytes = 10;
  uint64 transmit_packets = 11;
  uint64 transmit_errs = 12;
  uint64 transmit_drop = 13;
  uint64 transmit_fifo = 14;
  uint64 transmit_colls = 15;
  uint64 transmit_carrier = 16;
  uint64 transmit_compressed = 17;
}

// TCP counters for this network namespace (/proc/net/snmp).
message TcpStats {
  uint64 curr_estab = 1;
  uint64 retrans_segs = 2;
  uint64 in_errs = 3;
  uint64 out_rsts = 4;
  uint64 attempt_fails = 5;
}

// One block device or partition (/proc/diskstats).
message DiskStats {
  string device = 1;
  uint64 reads_completed = 2;
  uint64 reads_merged = 3;
  uint64 read_bytes = 4;
  double read_time_seconds = 5;
  uint64 writes_completed = 6;
  uint64 writes_merged = 7;
  uint64 written_bytes = 8;
  double write_time_seconds = 9;
  uint64 io_now = 10;
  double io_time_seconds = 11;
  double io_time_weighted_seconds = 12;
}

message FilesystemStats {
  string path = 1;
  uint64 size_bytes = 2;
  uint64 free_bytes = 3;  // including reserved blocks
  uint64 avail_bytes = 4; // available to this process
  uint64 files = 5;
  uint64 files_free = 6;
  bool readonly = 7;
}

// Pressure stall information for one resource (/proc/pressure).
message PressureStats {
  string resource = 1;
  double some_seconds = 2;
  optional double full_seconds = 3;
}

// This process's cgroup v2. Limits are local to the cgroup; ancestors may
// impose stricter ones. Controllers that are not enabled are omitted.
message CgroupStats {
  string path = 1;
  CgroupMemoryStats memory = 2;
  CgroupCpuStats cpu = 3;
  CgroupTaskStats tasks = 4;
}

message CgroupMemoryStats {
  uint64 current_bytes = 1; // including page cache and descendants
  int64 max_bytes = 2;      // -1 is unlimited
  int64 high_bytes = 3;     // -1 is unlimited
  uint64 low_events = 4;
  uint64 high_events = 5;
  uint64 max_events = 6;
  uint64 oom_events = 7;
  uint64 oom_kill_events = 8;
}

message CgroupCpuStats {
  double usage_seconds = 1;
  double throttled_seconds = 2;
  uint64 periods = 3;
  uint64 throttled_periods = 4;
  double quota_cores = 5; // -1 is unlimited
}

message CgroupTaskStats {
  uint64 current = 1; // including threads
  int64 max = 2;      // -1 is unlimited
}

// Background checksum scrub of published snapshot files. A mismatch also
// makes its collection unavailable with the failing file in its error.
message ScrubStats {
  uint64 passes = 1;          // completed passes over every collection
  uint64 files = 2;           // files checked
  uint64 bytes = 3;           // bytes read
  uint64 mismatches = 4;      // checksum mismatches, EIO, or unexpectedly missing files
  uint64 last_pass_end = 5;   // Unix milliseconds; absent before the first pass
  uint64 errors = 6;          // other file check errors; retried on the next pass
}

// Cached field metadata payload, excluding allocator overhead and unused
// hash-table capacity.
message FieldMetadataStats {
  uint64 bytes = 1;
  uint64 directories = 2;
  uint64 directory_bytes = 3;
  uint64 pages = 4;
  uint64 page_bytes = 5;
  uint64 entries = 6;
  uint64 entry_bytes = 7;
  uint64 names = 8;
  uint64 name_bytes = 9;
}

// Node memory: Luxir's own budgets and usage, and the process allocator's
// statistics where the allocator reports them.
message MemoryStats {
  IndexRamStats indexing_budget = 1;
  StorageRamStats storage_ram = 2;
  // Present only when Luxir runs on jemalloc.
  JemallocStats jemalloc = 3;
  FieldMetadataStats field_metadata = 4;
  // Configured budget for managed memory (max_ram_mb); not an RSS ceiling.
  // Zero is unlimited.
  uint64 node_budget_bytes = 5;
  // Per-request tracked search memory ceiling; zero disables rejection.
  uint64 search_request_limit_bytes = 6;
}

// Full catalog for a discovery cursor, scoped to this source boot.
message ReplicationCatalog {
  string boot = 1;
  string cursor = 2;
  repeated ReplicationCatalogEntry collections = 3;
}
message ReplicationCatalogEntry {
  string commit = 1;
  bool available = 2;
  string tenant = 3;
  string collection = 4;
  // xxh3-64 of the exact manifest bytes of `commit`, as 16 lowercase hex
  // digits (exact in every JSON client): a manifest of `commit` from any
  // source must hash to it.
  string manifest_xxh3 = 5;
}
message ReplicationInstalled {
  string follower = 1;
  string collection = 2;
  string commit = 3;
  string tenant = 4;
}

message ReplicationCollectionStatus {
  enum State {
    SYNCING = 0;
    SERVING = 1;
    WAITING = 2;
    STALE = 3;
    ORPHAN = 4;
    ERROR = 5;
  }
  string name = 1;
  string tenant = 9;
  string source_commit = 2;
  string serving_commit = 3;
  optional State state = 4;
  uint64 bytes_downloaded = 5;
  uint64 bytes_total = 6;
  string last_error = 7;
  uint64 next_retry = 8; // Unix milliseconds; zero when not backing off
}
message ReplicationStatus {
  string source = 1;
  string follower = 2;
  optional bool connected = 3;
  uint64 last_contact = 4; // Unix milliseconds
  repeated ReplicationCollectionStatus collections = 5;
  repeated FollowerStatus followers = 6;
}

message FollowerStatus {
  string follower = 1;
  string tenant = 6;
  string collection = 2;
  string commit = 3;
  uint64 last_seen = 4; // Unix milliseconds
  optional uint64 lag = 5; // generation distance; absent without a current acknowledgment
}

// Rolled-up counts.  Only the fields meaningful at a given level are set, so
// "collections" appears only on the node total and "shards" only on node and
// collection totals.  Absent means zero (proto3 JSON omits defaults).
message StatsTotals {
  uint64 collections = 1;
  uint64 shards = 2;
  uint64 segments = 3;
  uint64 committed_segments = 4;
  uint64 max_docs = 5;
  uint64 live_docs = 6;
  uint64 deleted_docs = 7;
  // On-disk bytes from a directory listing, present only with
  // StatsRequest.files: the whole index directory, including metadata and
  // in-flight files. Compare committed_bytes.
  optional uint64 bytes = 8;
  // Bytes referenced by the current published snapshot, summed from its file
  // descriptors without touching the filesystem. Excludes in-flight and
  // pin-retained files, so it is normally below `bytes`.
  uint64 committed_bytes = 9;
}

message StorageRamStats {
  uint64 used_bytes = 1; // Allocated RAM file buffers, including output and retained readers.
  uint64 limit_bytes = 2; // Zero is unlimited. Independent of the indexing budget.
}

message CollectionStats {
  string name = 1;
  string tenant = 7;
  StatsTotals totals = 2;
  uint64 schema_gen = 3; // Schema generation
  repeated ShardStats shards = 4;

  // Set for a collection that is not serving (failed to load, being deleted, or
  // a delete failed partway): kind is UNAVAILABLE and the message is the
  // reason. A node-wide walk also reports here a collection whose statistics
  // could not be read, with the failure's kind.
  Error error = 5;
  uint64 storage_ram_bytes = 6;
  // Set for a serving collection.
  CollectionActivityStats activity = 8;
}

// Engine work that reached this collection since it was opened. The node's
// ServiceStats also count requests that failed before resolving a collection,
// and keep their counts when a collection is deleted.
message CollectionActivityStats {
  // Searches, from submission to the final response.
  OutcomeStats searches = 1;
  OutcomeStats index_batches = 2;
  uint64 documents_accepted = 3;
  uint64 documents_rejected = 4;
  uint64 delete_ids_accepted = 5;
}

// Completed work by outcome, and its summed duration.
message OutcomeStats {
  uint64 ok = 1;
  uint64 error = 2;
  uint64 cancelled = 3;
  double seconds = 4;
}

message ShardStats {
  uint32 shard_id = 1;
  IndexStats index = 2;
}

message IndexStats {
  StatsTotals totals = 10;   // counts for this index alone
  uint64 commit_time = 1; // microseconds since the Unix epoch
  uint64 index_gen = 2;
  uint64 core_gen = 3;
  uint64 update_version = 4;
  uint64 schema_gen = 5; // Schema generation
  uint64 active_merges = 6;
  repeated AuxStats aux_indexes = 7;
  QueryCacheStats query_cache = 8;
  repeated SegmentStats segments = 9;
  uint64 snapshot_pins = 11;
  uint64 pin_retained_bytes = 12; // bytes whose only remaining owners are pins
  uint64 pin_idle_drops = 13;
  uint64 pin_budget_drops = 14;
  // Writer only: indexing inverters by state.
  uint64 inverters_busy = 15;
  uint64 inverters_idle = 16;
  uint64 inverters_flushing = 17;
  uint64 commits = 18; // writer only: commits since the writer opened
  // Writer only: resident delete packets held by its pending set or merge
  // catch-up, deduplicated across owners. Included in the node indexing
  // reservation.
  uint64 retained_delete_bytes = 19;
}

// Ids and generations that appear in filenames are reported in their
// filesystem spelling so stats output correlates directly with directory
// listings and logs: "seg" is the segment's data-file prefix (e.g. "s0a"),
// while generations are the length-prefixed base36 sortable strings embedded
// in filenames (e.g. live_gen "01" -> file "s0a__L01").
// Sortable strings order the same as the numbers they
// encode, so lexicographic comparison remains valid.  Empty (omitted in JSON)
// means none.  Generations that never appear on disk (index_gen, core_gen,
// update_version) stay numeric.
message SegmentStats {
  string seg = 1;
  string live_gen = 2;
  uint64 min_update_version = 3;
  uint64 max_update_version = 4;
  uint64 first_commit_time = 5; // microseconds since the Unix epoch
  int32 max_doc = 6;
  int32 live_docs = 7;
  int32 deleted_docs = 8;
  uint64 schema_gen = 9; // Schema generation
  bool committed = 10;
  bool merging = 11;
  uint32 merge_level = 12;
  repeated AuxStats overlays = 13;
  uint64 bytes = 14;
}

message AuxStats {
  string kind = 1;
  string field = 2;
  string name = 3;
  string gen = 4;  // sortable-string spelling as embedded in the files' names (see SegmentStats)
  uint64 commit_time = 5; // microseconds since the Unix epoch
  uint64 built_core_gen = 6;
  repeated string files = 7;
  uint64 bytes = 8;  // bytes of this entry's files; informational, already counted under its segment
}

message QueryCacheStats {
  bool enabled = 1;
  uint64 max_bytes = 2;
  uint64 resident_bytes = 3;
  uint64 metadata_bytes = 4;
  uint64 hits = 5;
  uint64 misses = 6;
  uint64 admissions = 7;
  uint64 builds = 8;
  uint64 byproduct_inserts = 9;
  uint64 publish_rejects = 10;
  uint64 evictions = 11;
  uint64 purges = 12;
  uint64 oversized_key_bypasses = 13;
  uint64 reader_stable_hits = 14;
  uint64 reader_stable_refreshes = 15;
  uint64 reader_stable_retires = 16;
  uint64 build_attempts = 17;
  uint64 capacity_dead_builds = 18;
  uint64 thrash_build_skips = 19;
  uint64 reader_dead_builds = 20;
  uint64 reader_thrash_build_skips = 21;
}

// Indexing RAM budget: the configured limit and the bytes reserved against it.
message IndexRamStats {
  uint64 limit_bytes = 1;     // zero is unlimited
  uint64 reserved_bytes = 2;  // may temporarily exceed the soft limit
  uint64 draining_bytes = 3;  // reserved bytes currently draining through flushes
  uint64 pending_merge_bytes = 4; // pending merge demand, capped at the limit when limited
  // Resident delete packets across all owners, including commit and merge
  // catch-up references. Included in reserved_bytes; flushing does not free them.
  uint64 retained_delete_bytes = 5;
}

// jemalloc's process-wide statistics (stats.*), read at one statistics epoch
// per request. allocated counts live bytes allocated through jemalloc,
// including objects cached by threads; active adds page-level fragmentation;
// resident is jemalloc's upper bound on its resident pages, including metadata
// and dirty pages awaiting decay. The process RssAnon also counts memory
// jemalloc does not manage.
message JemallocStats {
  string version = 1;
  uint64 allocated_bytes = 2;
  uint64 active_bytes = 3;
  uint64 metadata_bytes = 4;
  uint64 resident_bytes = 5;
  uint64 mapped_bytes = 6;
  // Virtual mappings kept for reuse instead of unmapped. Mostly purged; the
  // huge-page arenas can leave fringe pages resident.
  uint64 retained_bytes = 7;
  // Freed pages awaiting decay, across all arenas.
  uint64 dirty_bytes = 8;
  // Dedicated arena for indexing memory.
  ArenaStats indexing = 9;
  // Dedicated huge-page arena for big buffers (BigBuffer.h).
  ArenaStats big_buffer = 10;
}

// One dedicated allocator arena (a huge-page arena sums its two jemalloc
// arenas). Resident is jemalloc's upper bound.
message ArenaStats {
  uint64 allocated_bytes = 1;
  uint64 resident_bytes = 2;
}

// Admin control over the per-collection query cache. Actions compose and
// apply in this order: max_bytes, flush, reset_admission, reset_counters, then dump.
// flush drops resident values and entry metadata; sighting history survives,
// so a known query can be readmitted and rebuilt immediately.
// flush + reset_admission also forgets sightings, restarting admission
// tracking. reset_counters zeroes the cumulative stats.
// An empty collection targets every collection.
message CacheControlRequest {
  // Empty selects every collection of `tenant`, or of every tenant when
  // `tenant` is also empty (administration).
  string collection = 1;
  // Administration only. With a collection, empty is the caller's tenant.
  string tenant = 7;
  bool flush = 2;
  bool reset_admission = 3;
  bool reset_counters = 4;
  bool dump = 5;
  uint32 dump_limit = 6;  // max dump rows per shard; 0 = 100
  // Administration only. Sets the selected caches' byte budget before the
  // other actions; 0 disables caching and drops entries. With collection and
  // tenant both empty it is also the budget for collections created later.
  // Lasts for the node session: kept when a collection is replaced, dropped
  // when it is deleted, back to --query-cache-bytes on restart.
  optional uint64 max_bytes = 8;
}

// One resident cache entry. key_text is the printable-byte extraction from
// the serialized key (field names and terms survive; structure bytes do
// not); key_hash is a diagnostic fingerprint. bytes counts resident value
// payloads; segments_resident counts slots currently holding a value;
// reader_value marks a whole-reader live-exact value.
message CacheEntryDump {
  uint64 key_hash = 1;
  uint32 key_bytes = 2;
  string key_text = 3;
  string scope = 4;  // SEGMENT_STABLE | CORE_STABLE | READER_STABLE
  bool reader_value = 5;
  uint64 bytes = 6;
  uint32 segments_resident = 7;
  uint64 hits = 8;
  uint64 last_used_epoch = 9;
}

message ShardCacheControl {
  uint32 shard_id = 1;
  QueryCacheStats stats = 2;  // gathered after the requested actions
  repeated CacheEntryDump entries = 3;  // largest payload first, capped
  uint64 entries_resident = 4;  // uncapped resident-entry count at dump time
}

message CollectionCacheControl {
  string name = 1;
  string tenant = 4;
  repeated ShardCacheControl shards = 2;
  Error error = 3;  // as CollectionStats.error
}

message CacheControlResponse {
  repeated CollectionCacheControl collections = 1;
}

//
// Schema
//

// One analysis-chain component - a tokenizer, character filter, or token filter - named by its
// registry name, plus its parameters.  params values are typed JSON values
// (string, number, bool, string list), e.g. {"possessive": false} for kstem.
// A component that takes no parameters rejects any. The JSON dialect accepts a
// bare string for a parameterless component: "lowercase" == {"name": "lowercase"}.
message AnalyzerComponent {
  string name = 1;               // e.g., "unicode_word", "nfkc_cf"
  map<string, Val> params = 2;
}

// A text analysis chain: char filters, then one tokenizer, then token filters.
// Alternatively `name` selects a registered analyzer (a built-in preset such as
// "english", or one a plugin provides); it excludes tokenizer and filters, and
// char_filters alongside it replace the preset's char filters.
// The JSON dialect accepts a bare string for the named form:
// "english" == {"name": "english"}.
message AnalyzerDef {
  AnalyzerComponent tokenizer = 1;         // "whitespace" (default when absent), "keyword", "unicode_word"
  repeated AnalyzerComponent filters = 2;  // applied after tokenization, in order
  repeated AnalyzerComponent char_filters = 3; // whole-value cleanup before tokenization, in order
  string name = 4;                         // a registered analyzer name; combines only with char_filters
}

// Alternate representations of the same input value, keyed by local label.
// Absent inherits the parent's variants; present replaces the whole map;
// empty clears it. HTTP JSON represents this directly as an object.
message FieldVariants {
  // Each representation is addressed as <field>__<label>. Variant definitions
  // may inherit physical settings through parent, but cannot set multi,
  // stored, stored_resource, variants, or defaults. All representations share
  // the logical field's scalar, vector, or geographic shape.
  map<string, FieldDef> entries = 1;
}

// Default representations for bare field names. Each binding names "self"
// or a local variant label. Absent inherits the parent's defaults; present
// replaces both bindings. An omitted value binding on a TEXT primary selects
// its sole STRING variant; an omitted search binding on a STRING primary
// selects its sole TEXT variant. Multiple candidates require an explicit
// binding. With no candidate, or for other type combinations, use self.
// Inference uses resolved types; operations still check index/column support.
// Explicit <field>__<label> and <field>__self selectors bypass these defaults.
message FieldDefaults {
  // Match, phrase, simple query, expression terms, prefix, fuzzy, wildcard,
  // and regex queries, including their use in filters.
  optional string search = 1;

  // AnyOfQuery, ranges, field/range facets, sorts, and column expressions.
  // Bare field names in retrieval, exists, kNN, and geo use the primary.
  optional string value = 2;
}

// Whole-value STRING normalization using a keyword input and only normalizing
// filters. Absent inherits; present replaces; empty clears. HTTP JSON uses
// an array of components, e.g. ["nfkc_cf", "fold"]. Applied at ingest and
// to query literals and facet selections.
message NormalizerDef {
  repeated AnalyzerComponent filters = 1;
}

// Vector similarity metric.  NONE = storage-only, not kNN-searchable;
// L2 / IP / COSINE select the metric for exact column search and any
// ANN index.
enum VectorMetric {
  NONE = 0;
  L2 = 1;
  IP = 2;
  COSINE = 3;
}

// Approximate nearest-neighbor index settings for a VECTOR field: the codec
// and parameters of the per-segment IVF overlays built at commit and merge.
// Read when an overlay is built; each overlay records what it was built
// with, so a change applies to segments built afterwards. See
// docs/guide/vector-search.md#index-settings.
message VectorAnnDef {
  enum Codec {
    RABITQ = 0;  // IVF + RaBitQ (randomly rotated, centroid-relative bit codes)
    PQ = 1;      // IVF + product quantization
  }
  optional Codec codec = 1;  // absent: pq; rabitq is opt-in

  // IVF coarse lists per segment overlay. Absent or 0: sqrt(segment vectors),
  // capped at 4096. Clamped to the segment's vector count.
  optional int32 nlist = 2;

  message RaBitQ {
    // Bits per dimension, 1..9. Absent: 1. Above 1 (extended RaBitQ) a
    // 1-bit pass prunes with the error bound and survivors are re-estimated
    // with the extra bits.
    optional int32 bits = 1;
    // Query quantization bits, 0..8; 0 scans with the float query.
    // Absent: 4. Read at search time, so a change applies to existing
    // overlays.
    optional int32 query_bits = 2;
  }
  RaBitQ rabitq = 3;  // requires explicit codec rabitq

  message Pq {
    // Sub-quantizers. Positive m requires positive effective (inherited)
    // dims and must divide it. Absent or 0: automatic, including inferred
    // dims. Choose the largest divisor leaving at least 4 dimensions per
    // sub-quantizer, capped at max(32, dims / 8) for IP/cosine or 32 for L2.
    // If none does, choose the largest divisor under the same cap.
    optional int32 m = 1;
    optional int32 bits = 2;  // bits per sub-quantizer code, 1..8. Absent: 8.
  }
  Pq pq = 4;  // codec pq only
}

// A field, template, or variant definition, named by its enclosing map key.
// Unset properties inherit from parent, then use type defaults, except as
// documented on individual properties. HTTP JSON enum values are lowercase.
message FieldDef {
  string parent = 1;            // inherit properties from this field or template

  enum FieldClass {
    STRING = 0;    // unanalyzed string
    TEXT = 1;      // analyzed text
    INT = 2;
    FLOAT = 3;
    DOUBLE = 4;
    ID = 6;        // document identifier used for replacement and deletion
    VECTOR = 7;    // dense float vector
    DATE = 8;      // timestamp, stored as int64 units since the Unix epoch (see unit)
    GEO_POINT = 9; // latitude/longitude point
  }
  optional FieldClass type = 2; // required unless inherited from parent

  // Index acceleration. Numeric Match/Range and geographic predicates can
  // scan a column with NONE. Term queries on STRING/TEXT/ID require MATCH;
  // STRING columns alone do not provide term-query support.
  enum IndexMode {
    NONE = 0;    // no index
    MATCH = 1;   // term index for STRING/TEXT/ID, including term ranges
    RANGE = 2;   // numeric Match/Range or GEO_POINT predicates; requires column=true
  }

  // Unset inherits, falling back to MATCH for STRING/TEXT/ID and NONE
  // for other types. Other type/mode combinations are rejected.
  optional IndexMode index = 3;

  optional bool column = 4;      // store values in a per-field column
  // SINGLE is one value; DEFAULT enables the type's default multi mode.
  // SET sorts and deduplicates column values; ARRAY keeps their source order and repeats.
  // Stored source keeps order and repeats independently of the column mode.
  // DEFAULT resolves per representation: INT/FLOAT/DOUBLE/DATE/STRING
  // use SET, TEXT/VECTOR/GEO_POINT use ARRAY. Explicit SET is rejected on
  // an array-only primary and resolves to ARRAY on an array-only variant.
  // Explicit ARRAY applies to every representation. ID is reserved for the
  // single-valued id field. Variants inherit the declared mode and
  // cannot override it. Schema JSON views echo the declaration.
  // HTTP JSON accepts false, true (DEFAULT), "set", or "array".
  enum MultiMode {
    SINGLE = 0;
    DEFAULT = 1;
    SET = 2;
    ARRAY = 3;
  }
  optional MultiMode multi = 5; // unset inherits, falling back to SINGLE

  // TEXT only. Unset or empty inherits; a nonempty definition replaces the
  // entire analyzer. Without an inherited analyzer, defaults to whitespace.
  AnalyzerDef analyzer = 6;

  // Keep canonical source text before analysis/normalization for TEXT/STRING/ID
  // retrieval. Defaults to true for TEXT, false otherwise; unused on other types.
  optional bool stored = 7;

  // Stored-field group for stored TEXT/STRING/ID values, e.g. "_stored_body_",
  // declared in SchemaDef.stored_resources. Empty or unset inherits the
  // parent's group, falling back to "_stored_".
  optional string stored_resource = 8;

  // --- VECTOR fields ---

  // Vector dimensionality. Unset inherits, falling back to 0 (infer
  // from the first indexed value). A positive value enforces dimensions at ingest.
  // With truncate_dims, this is the full input dimension.
  optional int32 dims = 9;

  // Vector similarity metric.  Absent means inherit, else NONE (storage-only).
  optional VectorMetric metric = 10;

  // Caller asserts that all values for this field are already L2-normalized
  // (unit length).  For COSINE, this disables write-time and aux-build
  // normalization.  No effect on non-COSINE metrics.  Trust-only: not
  // validated at index time.
  optional bool normalized = 11;

  // For COSINE fields, normalize vectors before storing them in the column.
  // If unset, COSINE defaults to true unless normalized is true; other metrics
  // default to false.  A cosine field skips and logs zero / near-zero vectors
  // when normalized is false.
  optional bool normalize_on_write = 12;

  FieldVariants variants = 13; // alternate representations of this logical field
  FieldDefaults defaults = 14; // default search and value representations
  NormalizerDef normalizer = 15; // whole-value STRING normalization

  // Policy for indexed terms longer than 255 bytes: STRING after normalization,
  // TEXT after analysis, and IDs. Exact query values use the same policy.
  // Not valid on column-only STRING or other types. Changes do not rewrite
  // existing terms. See docs/guide/schema.md for ordering and query implications.
  enum LongTerms {
    TRUNCATE = 0; // keep a UTF-8-safe prefix of at most 255 bytes; values may merge
    REJECT = 1;   // reject overlong terms
    HASH128 = 2;  // prefix of at most 230 bytes plus 25 base36 hash digits
  }
  optional LongTerms long_terms = 16; // absent: inherit from parent, else hash128

  // VECTOR only. Keep the first truncate_dims components of every indexed
  // and query vector, for Matryoshka (MRL) embeddings whose prefixes are
  // usable embeddings. Requires dims (the full input dimension, which must be
  // larger) and metric COSINE, which renormalizes the prefix; normalized=true
  // is rejected. Inputs carry dims components, or truncate_dims for a vector
  // already truncated. The column, ANN overlays and kNN scoring use
  // truncate_dims. Unset inherits; 0 means no truncation.
  optional int32 truncate_dims = 19;

  // VECTOR only: ANN overlay settings. Absent inherits the parent's whole
  // definition (no per-property merge), else every VectorAnnDef default.
  VectorAnnDef ann = 22;

  // DATE only: unit of numeric ingest and stored epoch values. ISO-8601
  // text is converted to this precision, truncating toward earlier time.
  // NS reserves the int64 extrema and covers 1677-09-21 to 2262-04-11.
  // The unit is part of the field signature and cannot change on an existing
  // date definition. Absent inherits from the parent, falling back to ms.
  enum DateUnit {
    MS = 0; // milliseconds
    NS = 1; // nanoseconds
  }
  optional DateUnit unit = 24;

  // GEO_POINT and plugin_type fields. Skip a value that is not a valid point
  // (unreadable, out of range, or a z coordinate when ignore_z_value is false)
  // and index the rest of the document; in a multi-valued field only the bad
  // points are skipped. A plugin_type field skips the whole value when the
  // plugin rejects it. Unset inherits, else false: a malformed value fails
  // the document.
  optional bool ignore_malformed = 28;

  // GEO_POINT only. Accept a third (z, altitude) coordinate and drop it. Unset
  // inherits, else true. Set false to reject a point with a z coordinate.
  optional bool ignore_z_value = 29;

  // STRING only: a registered collation (a plugin's name and params) whose
  // sort keys the column stores in place of the normalized value, so sorting
  // the field orders by the collation. Requires index=NONE and column=true,
  // so it is normally a variant of the field it sorts (see FieldVariants and
  // FieldDefaults.value). The column then holds opaque key bytes: facets and
  // value expressions over it see keys, not text. Absent inherits; present
  // replaces. A changed definition is a new representation: segments written
  // before it do not carry its keys. HTTP JSON takes a bare name or
  // {"name": ..., "params": {...}}.
  AnalyzerComponent collation = 23;

  // A field type a plugin registered (Registries::fieldTypes): its name and
  // params. The authored value is handed whole (objects and arrays included)
  // to the plugin, which indexes it into hidden built-in sub-fields named
  // <field>$<suffix>; those are queried, sorted and faceted by that name, and
  // retrieving the field returns what the plugin projects from them. Excludes
  // type and every other property except parent and ignore_malformed (skip a
  // value the plugin rejects and index the rest of the document). Absent
  // inherits; a parent with a built-in type clears it. The name and params
  // are part of the sub-fields' signatures. HTTP JSON also reads
  // {"type": "<name>", "params": {...}} for a name that is not a built-in type.
  AnalyzerComponent plugin_type = 31;
}

// Chunk settings for one stored-field group (a FieldDef stored_resource).
// Every setting is optional; absent selects the default. Changes apply to
// segments written afterwards. A merge recompresses its inputs unless their
// codec and chunk limits already match; the level alone does not count.
message StoredResourceDef {
  enum Codec {
    LZ4 = 0;  // fast compression and decompression
    ZSTD = 1; // smaller chunks for repetitive text such as logs, at more CPU
  }
  // Chunk compression; absent selects lz4.
  optional Codec codec = 1;

  // ZSTD level from 1 (fastest) to 22 (smallest). Absent selects 3. Only valid
  // with codec zstd.
  optional int32 zstd_level = 2;

  // Target uncompressed bytes per chunk, 1024 to 4194304; absent selects 16384,
  // or 65536 with zstd. Larger chunks compress better, but each retrieval
  // decompresses a whole chunk.
  optional int32 chunk_size_bytes = 3;

  // Most documents per chunk, 1 to 65536; absent selects 128, or 1024 with
  // zstd. A chunk closes at whichever of the byte and document limits comes
  // first.
  optional int32 max_docs_per_chunk = 4;

  // Enable one ZSTD dictionary per resource, shared by its segments. The first
  // merge with at least 100 times the capacity (at most 8 MiB) of live stored
  // data trains it; earlier segments have none. Helps most with small chunks;
  // decoding can be slower with large chunks. No automatic retraining: changing
  // this setting, the capacity or codec clears it for a later merge to retrain.
  // After restart, use the dictionary from the largest live segment carrying one.
  // Only valid with codec zstd.
  optional bool zstd_dictionary = 5;

  // Dictionary capacity upper bound, 1024 to 262144 bytes; absent selects 65536.
  // Training can produce a smaller dictionary. Only valid with zstd_dictionary.
  optional int32 zstd_dictionary_bytes = 6;
}

message SchemaDef {
  // Concrete fields, keyed by field name.  Exact-name lookup consults only this
  // map.  The reserved "id" and "_version_" fields are always materialized: a
  // REPLACE_ALL that omits them gets the defaults; redefining them incompatibly, or
  // defining a second ID-class field, is an error. _version_ is fixed and
  // retrieval-only: it returns the update version of the request that indexed
  // each document, including allow_dups and documents without an ID.
  map<string, FieldDef> fields = 1;

  // Abstract definitions, keyed by template name.  Never directly usable as a
  // doc field; suffix matching ("title_w" -> "_w") consults only this map, and
  // any field/template may name one as parent.  A name in both maps is an error.
  map<string, FieldDef> templates = 2;

  // The order merges write documents in. Absent in a SET request keeps the
  // current setting; present with an empty field clears it. Changes affect
  // future merges only.
  IndexSort index_sort = 3;

  // A merge writes its documents in this field's order: postings, columns,
  // stored fields, norms and points all follow the new doc ids, so a merged
  // segment is exactly sorted. Ties keep merge source order, and with ASC or
  // DESC sources are concatenated by their minimum (ascending) or maximum
  // (descending) value. Documents without a value go last. A multi-valued
  // document sorts by its minimum value ascending, its maximum descending,
  // and its minimum Hilbert key under HILBERT. Flushed segments keep arrival
  // order.
  message IndexSort {
    // A concrete field or template instance: an int or date column for ASC
    // and DESC, a geo_point column for HILBERT. A plugin-typed field names
    // its sort proxy, one of its derived fields, instead.
    string field = 1;

    enum Order {
      ASC = 0;
      DESC = 1;
      // The 64-bit Hilbert curve key of the encoded latitude and longitude,
      // so spatially close points get close doc ids: geo leaves and column
      // zones cover small areas.
      HILBERT = 2;
    }
    Order order = 2;  // unset selects ASC
  }

  // Stored-field groups, keyed by the name fields use as stored_resource. A
  // name is '_', ASCII letters, digits, or underscores, and a closing '_' (for
  // example "_stored_body_"), so it never matches a field or suffix template.
  // A field may name only an entry here or the default "_stored_", which uses
  // the defaults without one. mode=set replaces the named entries and keeps
  // the others.
  map<string, StoredResourceDef> stored_resources = 4;
}

message SchemaRequest {
  string collection = 1; // empty selects the default collection, "main"
  // Administration only: the owning tenant. Empty is the caller's tenant.
  string tenant = 4;

  enum Mode {
    // Each named definition is SET to exactly the request's definition
    // (whole-definition, never a property-level merge); definitions not named
    // in the request are untouched.
    SET = 0;

    // Replace the entire schema with this definition (the reserved id and
    // _version_ fields are materialized when omitted).
    REPLACE_ALL = 1;
  }
  Mode mode = 2;
  SchemaDef schema = 3;
  // Updates only: as CommitParams.wait_for_replicas.
  ReplicaRequirement wait_for_replicas = 5;
  optional uint64 wait_for_replicas_timeout_ms = 6; // absent = 30000
}

message SchemaResponse {
  string commit = 2; // exact snapshot published by a schema update
  SchemaDef schema = 1;         // the resulting schema after the operation
  ReplicaResult replicas = 3;
  // Settings a schema update dropped without naming them, e.g.
  // "index_sort_cleared" when a REPLACE_ALL omits the current index_sort.
  repeated Warning warnings = 4;
}
