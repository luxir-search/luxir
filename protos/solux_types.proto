syntax = "proto3";

import "google/protobuf/struct.proto";

option java_package = "org.apache.solux.types";
option java_outer_classname = "SoluxTypes";
option objc_class_prefix = "Solux";

package solux.proto;


/// The target of this operation
message Target {
  repeated string name = 1;  // qualified collection name

  // Solux developers implementing a multi-tenant system could use an API-key (at a higher level... not in solux) as
  // a starting point akin to a current-working-directory to qualify the collection name.
  // Responses containing collection names should likewise be relative.
}

// Top-level search request that can contain multiple search operations.
message SearchRequest {
  // request_id is optional and opaque (server does not care what the value is).  If provided, the server will
  // echo it in the response.  Only really needed when a client streams multiple requests in the same RPC.
  string request_id = 1;
  Target collection = 2;

  // Multiple search operations in a single request.
  // An alternative could be to put the tag/name in the SearchOp itself
  map<string, SearchOp> ops = 3;

  // index view freshness requirement in microseconds. 0 (the default) means latest commit must be used.
  uint64 freshness_us = 4;

  // Civil frame for date math and offset-less date literals. Empty is UTC;
  // accepts Z, UTC, fixed offsets, or a case-sensitive IANA zone name.
  string time_zone = 5;

  // How the HTTP/NDJSON layer frames the response stream (request-level: one
  // stream has one framing).  ENVELOPE (default): one JSON envelope line per
  // batch.  DOCS: bare document lines with optional _header_ meta records -
  // see the docs.  The HTTP ?format=docs URL param is an alias for setting
  // this.  HTTP-only: gRPC responses are already framed DocList messages, so
  // requests setting DOCS over gRPC are rejected.
  ResponseFormat response_format = 6;

  // Return per-piece execution details for instrumented operations. Profiling
  // is request-wide so every operation observes the same instrumentation mode.
  bool profile = 7;

  // Intra-request parallelism: 0 = auto (engine decides), 1 = single-threaded
  // (on the server's serial search executor), -1 = single-threaded on the very
  // thread that received the request - no cross-thread dispatch at all, so that
  // transport thread is blocked for the query's duration (a scheduling-overhead
  // baseline / embedded mode, not a serving default).  Values above 1 are
  // reserved for a future parallelism budget and are rejected for now.
  int32 max_parallel = 8;
}

enum ResponseFormat {
  ENVELOPE = 0;
  DOCS = 1;
}

// Different types of top-level search operations.
message SearchOp {
  oneof kind {
    TopDocs top_docs = 1;
    Fusion fusion = 2;
    // future: function (or leave that as a query type?)

    // TODO: hmmm, should different facet types be be encapsulated by a single "Facet" message?
    FieldFacet field_facet = 8;
    RangeFacet range_facet = 9;
    GenOp gen_op = 15;
    // future: something like terms component... stream out all terms of one or more (or all) fields
  }
}

// A generic operation that is not strongly typed.
message GenOp {
  string name = 1;       // the name of the operation
  repeated Val args = 2; // arguments to the operation
}

// Placement preference for returned document fields: dense columns
// (DocList.columns) vs per-document maps (DocList.docs).  DEFAULT resolves
// per transport: HTTP/JSON -> ROWS, gRPC -> COLUMNS.  Under COLUMNS,
// explicitly named fields are returned as dense columns (discovered fields -
// wildcards, stored families - will use docs when those selectors land);
// under ROWS everything is returned in docs.
enum DocFormat {
  DEFAULT = 0;
  ROWS = 1;
  COLUMNS = 2;
}

message TopDocs {
  Query query = 1;            // unset selects all documents (browse / filter-only search)
  // A set of named filters on the main query.
  repeated NamedQuery filter = 2;
  int64 offset = 3;
  optional sint64 limit = 4;
  bool get_number = 5;          // return the number of matching documents
  bool get_scores = 6;          // return the relevancy score for each document returned
  repeated string fields = 7;   // fields to return for each document
  repeated SortSpec sorts = 8;
  int32 batch_size = 9;         // maximum number of documents to return in a single streaming response
                                // if max_batch_size >= limit, multiple responses may be generated
                                // The solux server may choose a lower value to protect against large in-memory responses.
  DocFormat document_format = 10;  // rows vs columns placement of returned fields (see DocFormat)

  map<string, SearchOp> ops = 15;  // sub-facets or search operations performed over docs that match this query.
}

// Hybrid-search fusion: run several source queries (each a full TopDocs spec)
// and merge their results into a single ranked list.
//
// Per-source response-shape fields (`fields`, `batch_size`, `offset`,
// `get_scores`, `get_number`, `document_format`) and per-source `ops` are
// ignored - Fusion controls response shape at the top level.  Each source's `query`, `sorts`,
// `limit`, and any per-source `filter` are used to produce that source's
// ranked list.
//
// The fusion-level `filter` is applied to every source.  It is computed once
// per segment and reused, so sharing common filters here avoids redundant
// work.  If a source also specifies its own filter, the two are ANDed.
message Fusion {
  // Named source queries.  Names are used for debugging / explanation and
  // (for future weighted-fusion methods) as the key for per-source weights.
  map<string, TopDocs> sources = 1;

  // Filter applied to every source.  Shared across sources so it's only
  // computed once per segment.
  repeated NamedQuery filter = 2;

  // Maximum number of fused documents to return.
  optional sint64 limit = 3;

  // Fusion method (currently only RRF).
  oneof method {
    RrfFusion rrf = 10;
  }

  // Response shape (mirrors TopDocs).
  int64 offset = 4;
  bool get_number = 5;
  bool get_scores = 6;
  repeated string fields = 7;
  int32 batch_size = 8;
  DocFormat document_format = 9;  // rows vs columns placement of returned fields (see DocFormat)

  // Reserved for future fusion sub-ops. Current servers reject a non-empty
  // map; callers must leave it empty.
  map<string, SearchOp> ops = 15;
}

// Reciprocal Rank Fusion: fused_score(d) = sum over sources s of
// 1 / (k + rank_s(d)), where rank_s(d) is d's 1-based rank in source s
// (or omitted if d does not appear in s).  k=60 is the standard default.
message RrfFusion {
  int32 k = 1;  // 0 means use default (60)
}

message SortSpec {
  string expr = 1;
  map<string, Val> vars = 2;

  enum SortDir {
    UNKNOWN = 0;
    ASC = 1;
    DESC = 2;
  }
  SortDir dir = 10;
}

message Query {
  // An unset kind selects all documents, same as `all`.
  oneof kind {
    Match match = 1;                // selects all documents with a value match in the specified field
    BooleanQuery boolean = 2;
    bool all = 3;                   // selects all documents
    ExistsQuery exists = 4;         // selects documents that supplied a value for the field
    PhraseQuery phrase = 5;         // selects all documents with a phrase
    KnnQuery knn = 6;               // approximate nearest-neighbor over a vector field
    ConstantScoreQuery constant_score = 7; // wraps a query and replaces each hit's score
    PrefixQuery prefix = 8;         // selects documents by term prefix
    FuzzyQuery fuzzy = 9;           // selects documents by fuzzy (edit-distance) term match
    SimpleQuery simple_query = 10;  // forgiving end-user query string (search-box input)
    RangeQuery range = 11;          // selects documents whose numeric field value is in a range
    ExprQuery expr = 12;            // an expression in the Solux query language (rigorous grammar)
    GeoBoxQuery geo_box = 13;       // selects GEO_POINT values inside an inclusive bounding box
    GeoDistanceQuery geo_distance = 14; // selects GEO_POINT values within a radius of a center
    BoostQuery boost = 15;          // multiplies every hit score of a wrapped query
    RescoreQuery rescore = 16;      // preserves matches and replaces each hit's score

    // TODO: wildcard query
    // TODO: function?
  }


}

message ExistsQuery {
  string field = 1;
}

message ConstantScoreQuery {
  Query query = 1;
  // Presence matters: unset means 1.0, while an explicitly set 0.0 is a real
  // constant score. The `optional` keyword gives this field explicit presence
  // so callers can distinguish those cases.
  optional float score = 2;
}

message BoostQuery {
  Query query = 1;
  // Multiplies every hit score of the wrapped query. Unset means 1.0;
  // explicit presence so 0 (legal: matches survive, scores become 0) is
  // representable. Must be finite and >= 0.
  optional float boost = 2;
}

message RescoreQuery {
  Query query = 1;
  string expr = 2;
  map<string, Val> vars = 3;
}

// Nearest-neighbor query against a searchable vector field.  Exact flat search
// scans the stored vector column by default.  If a vec.<field> aux index is
// present, the query can dispatch to that aux-backed engine instead.
//
// V1 limitations:
//   - The query vector must be non-empty and match the schema / segment dims.
//   - ANN indexes are best-effort above the candidate / breadth caps.
//
// liveDocs and any enclosing filter domain are applied inside the vector engine.
// Multi-valued vector fields collapse to one hit per doc using max-sim.
message KnnQuery {
  string field = 1;        // vector field name (e.g. "embedding_v")
  Vector query = 2;        // query vector - must match the field's dims
  int32 k = 3;             // number of nearest-neighbor documents to return
  int32 nprobe = 4;        // merge-stable IVF effort: lists to probe if this field
                           // were one IVF index with nlist=sqrt(live vectors).
                           // 0 = adaptive default, with host auto-deepening.
  int32 refine_candidates = 5; // exact number of approximate candidates fetched for
                           // full-precision rescore (clamped up to k). 0 = adaptive
                           // default (fixed headroom plus a k-decaying multiple).
  bool exact = 6;          // require exact (true top-k) results: the engine uses an
                           // execution path that guarantees them (currently a full
                           // scan of the stored vector column) and does not consult
                           // approximate ANN indexes. nprobe / min_scan_fraction /
                           // refine_candidates are ignored. Cost is linear in the
                           // number of stored vectors.
  float min_scan_fraction = 7; // optional floor for the internal scan fraction,
                           // in [0,1]. 0 = no floor.
}

  // use NamedValue here instead? Repeat field so this can be used to query multiple fields at once? Add a field glob/regex?
  // the alternative is to add more query types at the top level to be more explicit
message Match {
  string field = 1;
  Val val = 2;   // if val is an Array, this could be used for TermsQuery as well...  how to tell if scoring or not though?

  // How to combine the multiple terms an analyzed text field can produce.
  // Unset = OR.  Named after the OpenSearch match "operator".
  Operator operator = 3;

  // Minimum number of the analyzed terms that must match (the OR..AND middle
  // ground).  When set it overrides `operator`; clamped to the term count.
  // Mirrors BooleanQuery.min_match.
  int32 min_match = 4;

  enum Operator {
    OPERATOR_UNSPECIFIED = 0;  // treated as OR
    OR = 1;                    // a doc matches if any analyzed term matches
    AND = 2;                   // a doc must match every analyzed term
  }
}

// Matches documents whose field value falls in the given range.  All bounds
// are optional; omit a side for an open-ended range.  Set at most one of
// gte/gt (lower) and at most one of lte/lt (upper); setting both of a pair is
// an error.  With no bounds the query matches every document that has a value
// for the field.  A doc with no value never matches.
//
// Numeric fields (INT/FLOAT/DOUBLE/DATE) range over the column.  Bounds go
// through the same value-coercion contract as ingest, so querying a literal
// finds the documents ingested with it.  DATE accepts ISO-8601 strings or
// epoch millis, and a partial date names its whole window: bounds include the
// granule they name ([2024-01 TO 2024-06] covers January through June;
// exclusive bounds exclude the granule whole).  FLOAT/DOUBLE compare by
// IEEE-754 total order: -0.0 sorts below +0.0 and NaN sorts above +Inf.
//
// Term-backed fields (TEXT/STRING/ID) range over the terms dictionary in
// byte order (no collation), constant-scoring.  TEXT bounds are folded the
// way the field folds (case etc.), never tokenized.
message RangeQuery {
  string field = 1;
  Val gte = 2;   // lower bound, inclusive (>=)
  Val gt  = 3;   // lower bound, exclusive (>)
  Val lte = 4;   // upper bound, inclusive (<=)
  Val lt  = 5;   // upper bound, exclusive (<)
}

// Inclusive geographic bounding box in degrees. Bounds are quantized to the
// storage grid exactly like ingest. min_lon > max_lon crosses the dateline;
// min_lat > max_lat is an error. Boxes degenerate at +90 latitude or +180
// longitude match nothing.
//
// Named scalar bounds deliberately avoid positional ambiguity: the VALUE
// array contract [x, y] = [lon, lat] does not apply to this message.
message GeoBoxQuery {
  string field = 1;
  double min_lat = 2; // south edge, degrees in [-90, 90]
  double max_lat = 3; // north edge
  double min_lon = 4; // west edge, degrees in [-180, 180]
  double max_lon = 5; // east edge; min_lon > max_lon crosses the dateline
}

// Geographic distance query with a center in degrees and radius in meters.
// Matches when at least one GEO_POINT value is within the inclusive radius.
//
// Named center scalars deliberately avoid positional ambiguity: the VALUE
// array contract [x, y] = [lon, lat] does not apply to this message.
message GeoDistanceQuery {
  string field = 1;
  double lat = 2;           // center latitude, degrees in [-90, 90]
  double lon = 3;           // center longitude, degrees in [-180, 180]
  double radius_meters = 4; // inclusive radius, finite and non-negative
}

// Attach a name to a query so it can be referenced by other queries or facets.
message NamedQuery {
  string name = 1;
  Query query = 2;
}

message BooleanQuery {
  repeated Query filter = 1;       // required clauses that do not add to the score
  repeated Query required = 2;     // required clauses that do add to the score
  repeated Query optional = 3;     // optional clauses that add to the score
  repeated Query prohibited = 4;   // prohibited clauses that must not match

  // Minimum number of optional clauses that must match.  Unset (0): with any
  // required or filter clause present, optional clauses only rank coincident
  // matches; with only optional clauses, at least one must match.  Setting
  // min_match >= 1 makes the optional group a real constraint alongside
  // required/filter clauses; values above the clause count mean all of them.
  int32 min_match = 5;
}

// Matches documents where `field` has a term starting with `prefix`. TEXT
// fields apply multi-term normalization/folding without tokenization; STRING
// and ID fields use the bytes exactly. An empty prefix matches documents that
// have at least one indexed term for the field.
message PrefixQuery {
  string field = 1;
  string prefix = 2;
}

// Matches indexed terms within byte-wise Levenshtein distance of `term`. TEXT
// fields apply multi-term normalization/folding without tokenization; STRING
// and ID fields use it verbatim. Scoring queries use blended BM25 statistics;
// filter queries use constant scores.
message FuzzyQuery {
  string field = 1;
  string term = 2;
  // Maximum edit distance, 0..2. Unset = AUTO by term length:
  // 0 for <=2 bytes, 1 for <=5, else 2.
  optional int32 max_edits = 3;
  // Leading bytes that must match exactly. Unset = 1; 0 = no required prefix.
  optional int32 prefix_length = 4;
  // Max term expansions, closest terms first. Unset/0 = default 50. A
  // positive value requests that cap; the operator/clause budget may lower it
  // with a warning. Negative values are rejected.
  int32 max_expansions = 5;
}

message PhraseQuery {
  string field = 1;

  // Only set one of these.  A protobuf "oneof" was originally used, but it adds extra levels of indirection
  string text = 2;               // un-analyzed text that should yield multiple words when analyzed. ex: "Thomas Anderson"
  repeated string words = 3;     // un-analyzed list of words. ex: ["Yonik","Seeley"]
  repeated string terms = 4;     // analyzed list of terms as strings
  repeated bytes terms_bin = 5;  // analyzed list of binary (raw bytes) terms

  // Maximum spread of rebased positions: max(docPos-queryPos) minus
  // min(docPos-queryPos). Must be nonnegative. Adjacent transposition costs
  // 2; this is not the number of words between terms. Zero is exact.
  int32 slop = 6;
  repeated int32 positions = 15; // optional positions of the terms
}

// An expression in the Solux query language: the programmer's query string,
// with a rigorous grammar and precise parse errors (raw end-user input belongs
// in SimpleQuery instead).  Structure-only sugar over the Query tree - every
// expression has an exact structured equivalent, and text is never interpreted
// by the parser: value bytes pass through unanalyzed and analysis happens at
// query build, per field type.
//
// Syntax summary: field:value, field:"a phrase" (or '...'), field:(grouped
// boolean scope), AND / OR / NOT with real precedence (NOT > AND > OR),
// +required / -prohibited prefixes (may not mix with AND/OR at one level),
// ranges field:[a TO b] / {a TO b} and comparisons field:>=v, trailing * for
// prefix, term~N for fuzzy (bare ~ = auto), *:* matches everything, and the
// function form name(main value, arg=value, ...) reaching the callable query
// types by their JSON names (kNN and geo queries currently require structured
// messages). $name references a value bound in `vars`. Unfielded bare words
// are a parse error.
message ExprQuery {
  string q = 1;  // the expression

  // Values referenced from the expression as $name.  Bound as VALUES (never
  // re-parsed as syntax), so end-user input is safe to pass through:
  // {"q": "simple_query($input, fields=[title])", "vars": {"input": ...}}.
  map<string, Val> vars = 2;
}

// Forgiving end-user query for raw search-box input (dismax descendant).
// NEVER fails to parse: any input degrades to some query, and degraded
// constructs or ignored parameters are declared in SearchResponse.warnings.
//
// Syntax: bare words (searched across `fields`), + (the NEXT clause is
// required; needs a preceding clause to combine with, so a leading + is
// inert), -word (must not; under the default OR this is its own
// all-except-word clause - restrictive negation needs operator AND),
// a | b (or), "a phrase", (grouping), trailing * (prefix), word~N (fuzzy;
// bare ~ = auto edits), \ escapes the next character, and field:value /
// field:"a phrase" fielded terms.  A colon token whose field name is not
// queryable degrades to literal text against `fields` - never an error
// ("re: your email" must not blow up a search box).
message SimpleQuery {
  string q = 1;  // the raw user input

  // The fields unfielded (bare) terms search; scores sum across fields.
  // Required, non-empty: the never-fails contract covers q, not the request
  // envelope, and bare words need a home.
  repeated string fields = 2;

  // How adjacent clauses combine.  Unset = OR (any clause may match).
  Match.Operator operator = 3;

  // Minimum number of top-level optional clauses that must match (mirrors
  // BooleanQuery.min_match).  Silently inapplicable when the parsed top
  // level cannot honor it (a single clause, required clauses from + or the
  // AND operator): that depends on what the end user typed, and a query
  // writer should not have to know user input to author a warning-free
  // query.  A single clause is already its own min_match (the engine clamps
  // to the clause count).
  int32 min_match = 4;

  // Narrows which field names the field:value syntax may reach.  Empty =
  // every queryable schema field.  It can only narrow that set - listing a
  // name the schema cannot query does not make it work.  A field: token
  // outside the allowed set is literal text, never an error.
  repeated string allowed_fields = 5;
}


message FieldFacet {
  string field = 1;
  optional sint64 limit = 2;         // maximum number of buckets to return
  optional int64 mincount = 3; // the minimum count of a bucket to be included in the response
  bool missing = 4;
  repeated SortSpec sorts = 5; // how to sort the buckets, if not specified, the default is by count descending
  map<string, SearchOp> ops = 6;  // sub-facets or search operations performed per bucket
}

message CalendarGap {
  int32 n = 1; // number of civil units per bucket; must be positive
  enum Unit {
    UNKNOWN = 0;
    DAY = 1;
    WEEK = 2;
    MONTH = 3;
    QUARTER = 4;
    YEAR = 5;
  }
  Unit unit = 2;
}

message RangeFacet {
  string field = 1;
  Val start = 2; // required inclusive start of the range
  Val end = 3;   // required exclusive end of the range
  oneof gap_kind {
    Val gap = 4; // fixed-width gap in the field's integer value space
    CalendarGap calendar_gap = 10; // civil gap for DATE fields only
  }
  optional int64 mincount = 5; // the minimum count of a bucket to be included in the response
  bool missing = 6;
  repeated SortSpec sorts = 7; // how to sort the buckets, if not specified, the default is by bucket id ascending
  map<string, SearchOp> ops = 8;  // sub-facets or search operations performed per bucket
  string time_zone = 9; // empty inherits SearchRequest.time_zone; DATE fields only
}

// A "domain" defines a set of documents to do computations over (like facets)
message Domain {
  string op_name = 1;                 // The name of a search operation that yields a set of documents. If missing
                                      // The first TopDocs operation in the request is assumed.
  Query root = 2;                     // Resets the domain to this root query.
  repeated string include_filter = 3; // Names of filters to apply (normally not needed unless a new root was selected)
                                      // A special name of "*" means all filters applied to the reference domain.
  repeated string exclude_filter = 4; // Names of filters to exclude (i.e. not apply) Used for multi-select faceting.
  repeated NamedQuery filter = 5;     // Additional named filters to apply
}

// A declared degradation: the request was served, but not exactly as written.
// Silent substitution is forbidden - anything dropped, degraded, ignored, or
// clamped announces itself here.  One channel, several tenants (degraded
// simple_query clauses today; expansion clamps, partial results later).
message Warning {
  string code = 1;     // stable machine key, e.g. "fuzzy_clamped", "field_narrowed"
  string message = 2;  // human-readable detail
}

// Execution details for one request. Operations opt into profiling
// incrementally; currently string field facets are instrumented.
message ExecutionProfile {
  repeated ExecutionProfileOp ops = 1;
}

message ExecutionProfileOp {
  string name = 1;
  repeated ExecutionProfilePiece pieces = 2;
}

// One independently executed index piece. A segment is the current piece
// granularity; future segment slices are additional kind="segment" pieces.
message ExecutionProfilePiece {
  string kind = 1;
  int32 segment = 2;
  int32 max_doc = 3;
  string strategy = 4;
  optional sint64 cardinality = 5;
  optional sint64 domain_size = 6;
  int64 thread_id = 7;
  uint64 elapsed_us = 8;
  // Free-form execution notes FOR HUMAN READING: one short clause per entry
  // (column reader choice, terms-index vs column, "want=hash, found=skinny"
  // when the shared accumulator already outgrew this piece's pick, per-field
  // notes when one piece reads several columns).  Not part of the API - the
  // wording, ordering, and entry count change with the engine, so no consumer
  // outside this repo should parse it (tests ship with the code and may match
  // a fragment to confirm a path fired).  Deliberately unstructured so new
  // strategies never need schema changes; repeated so pretty-printed JSON
  // stays readable without escaped newlines.
  repeated string details = 9;
}

// Top-level response to a Search request
message SearchResponse {
  string request_id = 1;
  map<string, Val> ops = 2; // the results of the search operations in the request, keyed by operation name.
  string error = 3;         // If non-empty, the request failed.  ops may be empty or partial.
  repeated Warning warnings = 4; // declared degradations; the request still succeeded
  ExecutionProfile profile = 5; // present only when SearchRequest.profile was true
  bool more = 15;  // if true, expect at least one more streaming response to the logical request.
}


// A batch of returned documents.  Document i is the merge of columns row i
// and docs[i]; all-columns (docs absent) and all-docs (columns empty) are
// just the degenerate cases.  Which fields land where is a function of the
// request (see DocFormat), never of the data.
message DocList {
  // Exact number of matching documents; set when the request asked get_number.
  // Named to match the wire rendering everywhere ("found" in the HTTP JSON
  // envelope and the format=docs _header_): the JSON response IS a flattened
  // DocList, so its keys are these field names.
  optional sint64 found = 1;

  // Dense columns; each has exactly row_count slots.
  map<string, Column> columns = 3;

  // Per-document field maps.  When present: exactly row_count entries;
  // docs[i] holds the fields of document i not represented as a dense
  // column.  A field name never appears in both columns and docs[i].
  repeated Map docs = 5;

  // Authoritative batch size.  Zero-column, zero-docs batches still have
  // one (e.g. count-only requests); column lengths and docs alignment are
  // validated against this rather than "the first column".
  int32 row_count = 6;

  int64 offset = 4;
  map<string, Val> ops = 14; // sub-operation results performed on the TopDocs query.
  bool more = 15; // expect more results to be streamed back?
}


message FacetResult {
  optional sint64 total_buckets =  1; // The total number of buckets *if* it was requested.  This can be expensive to calculate.
  Column bucket_ids = 2;
  repeated int64 counts = 3;
  optional int64 missing = 4; // the number of documents that do not have this field
  map<string, Val> ops = 22;  // sub-operation results performed per bucket, like a sub-facet or statistics.
  int64 offset = 6;
}

// When facet sub-operations are returned separately, a Bucket is used to represent a single facet bucket
// as a placeholder in the response for the sub-operation results.
// Alternatively, we could return a partial result at the top level, with a path specifier.
message Bucket {
  Val bucket_id = 1;
  map<string, Val> ops = 3;
}


//
//  Indexing
//

// Parameters governing how a commit is performed.  Presence of this message in an
// UpdateRequest indicates the request should commit; absence means no commit.
message CommitParams {
  // Commit within this many microseconds.
  // This parameter can be useful to ensure that too many commits aren't being done that can hurt
  // both indexing and search performance, but still places an upper bound on how stale the data can be.
  // The default value of 0 causes an immediate commit before the response is sent,
  // while a positive value will not wait for the commit before the response is sent.
  uint64 commit_within_us = 1;

  // Build missing aux overlays as part of this commit. An overlay already
  // present on a segment is retained rather than rebuilt.
  //   []                 - request no aux builds
  //   ["*"]              - build every eligible missing vector overlay
  //   ["vec.title_v"]    - build this missing overlay (matched by AuxIndexInfo.name)
  //   ["vec.*"]          - (future) glob-match by prefix
  repeated string build_aux_indexes = 2;

  // If true, this commit will wait for any in-flight merges to finish before publishing.
  bool wait_for_merges = 3;

  // Merge down so the data visible at this commit resides in at most this many
  // segments. 0 (default) = no forced merging. The response is not sent until
  // the merged index is durably published: at return, everything this commit
  // made visible lives in <= max_segments segments (concurrent ingestion after
  // this commit may add new segments; they are not covered by the promise).
  // The response waits for the merged layout even when commit_within_us is
  // positive.
  uint32 max_segments = 4;
}

message UpdateRequest {
  // request_id is optional and opaque (server does not care what the value is).  If provided, the server will
  // use it in the UpdateResponse.  This is useful for the client to correlate requests and responses in
  // streaming RPCs.
  string request_id = 1;

  // Reserved for future stream scheduling. Current servers ignore stream_id;
  // use request_id to correlate responses rather than depending on order.
  int64 stream_id = 2;

  Target collection = 3;

  // Current update handling consumes row maps in docs. The columns member is
  // reserved for a future aligned-column ingest path; callers must leave it
  // empty because a non-empty value is not indexed yet.
  repeated Map docs = 4;
  map<string, Column> columns = 5;

  // Document IDs to delete.  Deletes never fail per-id; deleting a nonexistent id
  // is a no-op.
  repeated string delete_ids = 6;

  // If true, allow documents with duplicate IDs (skip overwrite/dedupe).
  // Default (false) overwrites any existing document with the same ID.
  bool allow_dups = 7;

  // If true, all documents in this request must be successfully indexed or none will be.
  // Processing stops at the first failing document: documents already indexed by this
  // request are rolled back, queued delete_ids from this request are rolled back, and
  // later documents are not attempted (and not listed in errors).
  // Atomicity is per-request; it does not span multiple requests in a stream.
  bool all_or_none = 8;

  // If true, return the ids of indexed documents in the response.
  bool return_ids = 9;

  // Commit parameters.  If present, this request will commit; if absent, no commit is performed.
  CommitParams commit = 10;
}

// The response to an update request.  In streaming mode the server sends exactly one
// response per request.
message UpdateResponse {
  // This is the request_id from the UpdateRequest, if it was set.
  string request_id = 1;

  // The update version assigned to the update request.
  uint64 update_version = 2;

  enum Status {
    UNKNOWN = 0;          // the default
    OK = 1;               // the update was successful
    PARTIAL = 2;          // part of the request took effect, part failed (see errors)
    ERROR = 3;            // the request failed.  If error_message is empty, the failure was
                          // per-document (see errors) and the request had no visible effect
                          // on the index.  If error_message is set, the failure was
                          // request-level (e.g. commit pipeline) and the effect of
                          // individual documents is indeterminate beyond what errors lists.
  }

  Status status = 3;

  // ids of documents that were successfully indexed, if return_ids was set to true in the
  // request.  In request order; failed documents are omitted (align against docs by
  // skipping errors[].index).  A successfully indexed doc without a string/bytes id
  // contributes an empty string.  Only meaningful when status is OK or PARTIAL; on a
  // request-level ERROR the listed documents may have been rolled back.
  repeated string ids = 4;

  message Error {
    // the id of the failed document as given in the request (empty if absent or not a
    // string/bytes value)
    string id = 1;
    string error_message = 2;
    // position of the failed document within the request's document list
    int32 index = 3;
    // for an invalid value for a field, we could actually give that field/value in a more structured way
  }
  // Per-document failures.  A failed document has no effect on search results; the
  // previous version of the document, if any, is untouched.
  repeated Error errors = 5;

  // Request-level error (not tied to a single document), e.g. a failure in the commit
  // pipeline.  Set when status == ERROR for a non-document failure.
  string error_message = 6;
}




// name : value
message NamedValue {
  string name = 1;
  Val val = 2;
}

message Map {
  // Unordered map of dynamically typed values.
  map<string, Val> fields = 1;
}

message Val {
  oneof kind {
    // Represents a null value.
    google.protobuf.NullValue null = 1;
    string s = 2;
    sint64 i = 3;  // since the encoding is the same, we don't bother distinguishing between 32 and 64 bit int
    double d = 4;
    float f = 5;
    bool b = 6;
    bytes bin = 7;
    Map map = 8;
    ArrVal arr = 9;
    ArrStr arr_s = 10;
    ArrInt arr_i = 11;
    ArrFloat arr_f = 12;
    ArrDouble arr_d = 13;
    ArrBin arr_bin = 14;
    Vector vec = 15;              // single dense vector (single-valued vector field, or one element)
    ArrVector arr_vec = 16;       // list of vectors (multi-valued vector field per doc)
    DocList docs = 100; // a list of documents, used for search results
    FacetResult facet = 101; // result of a facet operation
  }
}

message ArrVal {
  // Repeated field of dynamically typed values.
  repeated Val v = 1;
}

message ArrStr {
  repeated string v = 1;
}

message ArrInt {
  repeated sint64 v = 1;
}

message ArrFloat {
  repeated float v = 1;
}

message ArrDouble {
  repeated double v = 1;
}

message ArrBin {
  repeated bytes v = 1;
}

// Array of arrays, used in columns for multi-valued fields.  One could use
// ArrVal instead, but this has less indirection and stronger typing.
message ArrArrStr {
  repeated ArrStr v = 1;
}

message ArrArrInt {
  repeated ArrInt v = 1;
}

message ArrArrFloat {
  repeated ArrFloat v = 1;
}

message ArrArrDouble {
  repeated ArrDouble v = 1;
}

message ArrArrBin {
  repeated ArrBin v = 1;
}

// A dense vector value.  The kind oneof leaves room for quantized variants
// (int8, binary, etc.) without breaking wire compatibility - readers detect
// the encoding via the populated field.  Dimensionality is implicit in the
// chosen variant: f32.v_size() for the f32 case, byte length / stride for
// future packed variants.
message Vector {
  oneof kind {
    ArrFloat f32 = 1;
    // reserved for future quantization (e.g. ArrInt8 int8, bytes binary).
  }
}

// A list of vectors, used as a per-doc cell for multi-valued vector fields.
message ArrVector {
  repeated Vector v = 1;
}

// although the encoding is the same, the stub mapping is not and could blow up memory for large arrays
// if we always use 64 byte ints.
// TODO: if we can do custom decoding, an array that specifies a min/max would be even more efficient
message ArrInt32 {
  repeated sint32 v = 1;
}

message ColStr {
  // this will cause an additional tag (byte) per string value, but strings are normally somewhat larger anyway
  // repeated google.protobuf.StringValue v = 1;
  // "" unless a real empty string occurs in the batch, in which case a
  // string greater than every batch value is used (see the
  // ColInt.missing_val sentinel note; the check is exact).
  string missing_val = 1;
  repeated string v = 2;
}

// The distinction between a column and an array is that column values are somehow "nullable".
// This is a requirement to get different columns to "line up" if there mare missing values
// in some of them.
message Column {
  oneof kind {
    ColStr col_s = 1;
    ColInt col_i = 2;
    ColFloat col_f = 3;
    ColDouble col_d = 4;
    ArrArrStr multi_s = 5;  // name col_ss? (after dynamic field naming convention in solr)?
    ArrArrInt multi_i = 6;
    ArrArrFloat multi_f = 7;
    ArrArrDouble multi_d = 8;

    ColMap col_map = 14;
    ArrVal col_val = 15; // array-of-value is already nullable, so we don't have a separate column type for it
    ColVector col_vec = 16;    // single-valued vector column: one Vector per doc; missing = unset oneof
    MultiVector multi_vec = 17; // multi-valued vector column: one ArrVector per doc; missing = empty list
  }
}

// Single-valued vector column.  Each Vector slot is independently nullable
// via its empty oneof - no separate missing_val needed.
message ColVector {
  repeated Vector v = 1;
}

// Multi-valued vector column.  Empty ArrVector means "doc does not have the
// field"; absence is indistinguishable from an empty list, which matches the
// indexing behavior (an empty list of vectors is not stored).
message MultiVector {
  repeated ArrVector v = 1;
}

message ColInt {
  // Sentinel held in v slots for docs without a value.  The server chooses
  // it per column per batch to be a value that does NOT otherwise occur in
  // v, so the v[i] != missing_val check is exact: 0 when absent from the
  // batch (cheapest varint), else an extreme, else any unused value.
  // Presence bitmaps / missing-index lists were considered and rejected in
  // favor of keeping this single mechanism.  Multi-valued columns signal
  // missing structurally: empty array.  JSON responses are hand-rendered
  // and represent missing slots as null.
  sint64 missing_val = 1;
  repeated sint64 v = 2;
}

message ColFloat {
  // Chosen per batch like ColInt.missing_val (the check is exact).  Never
  // NaN (it compares unequal to itself); +0.0/-0.0 are treated as one value
  // when choosing.
  float missing_val = 1;
  repeated float v = 2;
}

message ColDouble {
  // See ColFloat.missing_val.
  double missing_val = 1;
  repeated double v = 2;
}

message ColMap {
  repeated Map v = 1;
}

//
// Index Management
//

message IndexInfo {
  uint64 version = 1;                 // Version of the index format
  uint64 commit_time = 2;             // Commit time of this index (microseconds since epoch)
  uint64 index_gen = 3;               // Generation of this index (incremented on each commit)
  uint64 core_gen = 4;                // Segment composition generation (incremented only when segments change, not deletes)
  uint64 update_version = 5;          // Highest update version in this index (incremented on each update)
  uint64 schema_gen = 6;              // Schema generation (incremented on each schema change)
  repeated SegmentInfo segments = 15; // List if segments in this index

  // Auxiliary indexes built at index scope.  Segment-local overlays live on
  // SegmentInfo.overlays.
  repeated AuxIndexInfo aux_indexes = 16;
}

// An auxiliary index entry built at a particular commit.  Used for both
// index-level aux indexes and segment-local overlays.
// Files use the naming convention "s_<name>_<sortable_gen>_<sortable_fnum>".
message AuxIndexInfo {
  string kind = 1;             // e.g. "vector_faiss"
  string field = 2;            // empty if not field-scoped
  string name = 3;             // unique identifier; convention: "<kind_short>.<field>" (e.g. "vec.title_v")
  uint64 gen = 4;              // index_gen this aux index was built at
  uint64 commit_time = 5;      // microseconds since epoch
  repeated string files = 6;   // segment-style filenames that comprise this aux index
  bytes opaque_meta = 7;       // kind-specific metadata blob

  // Optional index-level core_gen stamp.  Segment overlays, including vector
  // ANN overlays, leave this at 0; their validity is segment liveness.
  // Future index-level aux kinds that embed segment composition may set it and
  // have writer code invalidate them when core_gen changes.
  uint64 built_core_gen = 8;
}

// Per segment information
message SegmentInfo {
  uint64 seg_id = 1;                    // Unique identifier for the segment
  uint64 live_gen = 2;                  // Generation for live docs file (0 = all live, no deletes, no file)
  uint64 min_version = 3;               // Minimum update version in this segment
  uint64 max_version = 4;               // Maximum update version in this segment
  uint64 commit_time = 5;               // First time this segment was committed (microseconds since epoch)
  int32  max_doc = 6;                   // Number of documents in this segment (ignoring deletes)
  int32  live_docs = 7;                 // Number of non-deleted documents in this segment
  uint64 schema_gen = 8;               // Schema generation this segment was indexed under

  // Segment-local auxiliary overlays.  Vector ANN indexes are recorded here
  // with kind "vector_faiss"; validity is segment liveness, not core_gen.
  repeated AuxIndexInfo overlays = 9;
}

message CreateCollectionRequest {
  string name = 1;
  SchemaDef schema = 2;
}

message CreateCollectionResponse {
  string name = 1;
}

message DeleteCollectionRequest {
  string name = 1;
}

message DeleteCollectionResponse {
  string name = 1;
}

// Operational statistics. An absent collection target requests every
// collection on the node; per-segment records are opt-in because they are the
// only unbounded part of the response.
message StatsRequest {
  Target collection = 1;
  bool segments = 2;
}

message StatsResponse {
  StatsTotals totals = 1;
  repeated CollectionStats collections = 2;
  IndexRamStats index_ram = 3;
}

// Rolled-up counts.  Only the fields meaningful at a given level are set, so
// "collections" appears only on the node total and "shards" only on node and
// collection totals.  Absent means zero (proto3 JSON omits defaults).
message StatsTotals {
  uint64 collections = 1;
  uint64 shards = 2;
  uint64 segments = 3;
  uint64 committed_segments = 4;
  uint64 max_docs = 5;
  uint64 live_docs = 6;
  uint64 deleted_docs = 7;
}

message CollectionStats {
  string name = 1;
  StatsTotals totals = 2;
  uint64 schema_gen = 3;
  repeated ShardStats shards = 4;
  string error = 5;
}

message ShardStats {
  uint32 shard_id = 1;
  IndexStats index = 2;
}

message IndexStats {
  StatsTotals totals = 10;   // counts for this index alone
  uint64 commit_time = 1;
  uint64 index_gen = 2;
  uint64 core_gen = 3;
  uint64 update_version = 4;
  uint64 schema_gen = 5;
  uint64 active_merges = 6;
  repeated AuxStats aux_indexes = 7;
  FilterCacheStats filter_cache = 8;
  repeated SegmentStats segments = 9;
}

message SegmentStats {
  uint64 seg_id = 1;
  uint64 live_gen = 2;
  uint64 min_update_version = 3;
  uint64 max_update_version = 4;
  uint64 first_commit_time = 5;
  int32 max_doc = 6;
  int32 live_docs = 7;
  int32 deleted_docs = 8;
  uint64 schema_gen = 9;
  bool committed = 10;
  bool merging = 11;
  uint32 merge_level = 12;
  repeated AuxStats overlays = 13;
}

message AuxStats {
  string kind = 1;
  string field = 2;
  string name = 3;
  uint64 gen = 4;
  uint64 commit_time = 5;
  uint64 built_core_gen = 6;
  repeated string files = 7;
}

message FilterCacheStats {
  bool enabled = 1;
  uint64 max_bytes = 2;
  uint64 resident_bytes = 3;
  uint64 metadata_bytes = 4;
  uint64 hits = 5;
  uint64 misses = 6;
  uint64 admissions = 7;
  uint64 builds = 8;
  uint64 byproduct_inserts = 9;
  uint64 publish_rejects = 10;
  uint64 evictions = 11;
  uint64 purges = 12;
  uint64 oversized_key_bypasses = 13;
  uint64 reader_stable_hits = 14;
  uint64 reader_stable_refreshes = 15;
  uint64 reader_stable_retires = 16;
}

message IndexRamStats {
  uint64 limit_bytes = 1;
  uint64 reserved_bytes = 2;
}

//
// Schema
//

message AnalyzerDef {
  string tokenizer = 1;           // e.g., "whitespace", "keyword"
  repeated string filters = 2;    // e.g., ["lowercase"] - applied in order
}

// Vector similarity metric.  NONE = storage-only, not kNN-searchable;
// L2 / IP / COSINE select the metric for exact column search and any
// aux-backed ANN engine.  (File-scope because proto enum values scope to the
// enclosing message, and FieldDef.IndexMode already claims NONE.)
enum VectorMetric {
  NONE = 0;
  L2 = 1;
  IP = 2;
  COSINE = 3;
}

// A field (or template) definition.  The field's name is the SchemaDef map key,
// not a member.  Every property is optional-presence: absent means "inherit from
// parent, else the type's default"; JSON enum values are lowercase ("text").
message FieldDef {
  string parent = 1;            // inherit properties from this field or template

  enum FieldClass {
    STRING = 0;    // unanalyzed string
    TEXT = 1;      // analyzed text
    INT = 2;
    FLOAT = 3;
    DOUBLE = 4;
    BIN = 5;       // reserved; the current engine has no usable BIN field handler
    ID = 6;        // unique id field with co-located version
    VECTOR = 7;    // dense float vector, stored as a fixed-size binary column
    DATE = 8;      // timestamp, stored as int64 milliseconds since the Unix epoch
    GEO_POINT = 9; // latitude/longitude point, packed into one int64 column value
  }
  optional FieldClass type = 2;  // if unset, inherited from parent

  // Which query classes are index-accelerated for this field.  Values name the
  // result contract, not the structure: NONE still answers Match / Range
  // queries through a column scan when column is set, just without an
  // index.  RANGE is a superset of MATCH (an exact match is a [v,v] range).
  enum IndexMode {
    NONE = 0;    // no index
    MATCH = 1;   // Match queries accelerated (term postings; TEXT: analyzed full-text)
    RANGE = 2;   // Range and Match queries accelerated (numeric / DATE / GEO_POINT fields)
  }
  optional IndexMode index = 3;  // absent: inherit from parent, else the type default

  optional bool column = 4;      // store values in a per-field column
  optional bool multi = 5;       // multi-valued

  AnalyzerDef analyzer = 6;      // for TEXT fields; if unset, inherited from parent

  optional bool stored = 7;      // if true, raw values are kept in the segment's stored-fields resource

  // When stored=true, names the target stored-fields resource (StoredFieldType
  // entry in the schema).  Empty / unset means the default "_stored_" resource.
  // Use named resources to group fields into separate column families (e.g.
  // "_stored_embeddings_" for co-located embedding bytes).
  string stored_resource = 8;

  // --- VECTOR fields ---

  // Vector dimensionality.  Absent/0 means "infer from first indexed value";
  // a positive value enforces strict validation at index time.
  optional int32 dims = 9;

  // Vector similarity metric.  Absent means inherit, else NONE (storage-only).
  optional VectorMetric metric = 10;

  // Caller asserts that all values for this field are already L2-normalized
  // (unit length).  For COSINE, this disables write-time and aux-build
  // normalization.  No effect on non-COSINE metrics.  Trust-only: not
  // validated at index time.
  optional bool normalized = 11;

  // For COSINE fields, normalize vectors before storing them in the column.
  // If unset, COSINE defaults to true unless normalized is true; other metrics
  // default to false.  A cosine field skips and logs zero / near-zero vectors
  // when normalized is false.
  optional bool normalize_on_write = 12;
}

message SchemaDef {
  // Concrete fields, keyed by field name.  Exact-name lookup consults only this
  // map.  The reserved "id" and "_version_" fields are always materialized: a
  // REPLACE_ALL that omits them gets the defaults; redefining them incompatibly, or
  // defining a second ID-class field, is an error.
  map<string, FieldDef> fields = 1;

  // Abstract definitions, keyed by template name.  Never directly usable as a
  // doc field; suffix matching ("title_w" -> "_w") consults only this map, and
  // any field/template may name one as parent.  A name in both maps is an error.
  map<string, FieldDef> templates = 2;
}

message SchemaRequest {
  Target collection = 1;

  enum Mode {
    // Each named definition is SET to exactly the request's definition
    // (whole-definition, never a property-level merge); definitions not named
    // in the request are untouched.
    SET = 0;
    // Replace the entire schema with this definition (the reserved id and
    // _version_ fields are materialized when omitted).
    REPLACE_ALL = 1;
  }
  Mode mode = 2;
  SchemaDef schema = 3;
}

message SchemaResponse {
  SchemaDef schema = 1;         // the resulting schema after the operation
}
