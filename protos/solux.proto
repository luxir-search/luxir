syntax = "proto3";

import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";
import "solux_types.proto";

option java_multiple_files = true;
option java_package = "org.apache.solux";
option java_outer_classname = "SoluxProto";
option objc_class_prefix = "Solux";

package solux;

// The greeting service definition.  Just here temporarily as a sanity check around running multiple services
// as well as having a service that just works.
service Greeter {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply) {}
  rpc SayHello2 (HelloRequest) returns (HelloReply) {}
  rpc SayHelloStreaming (stream HelloRequest) returns (stream HelloReply) {}
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings
message HelloReply {
  string message = 1;
}


service Indexer {
  rpc Update(solux.proto.UpdateRequest) returns (solux.proto.UpdateResponse) {}
  rpc UpdateStream(stream solux.proto.UpdateRequest) returns (stream solux.proto.UpdateResponse) {}
}
