name: Dependency image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'deps/vcpkg.json'
      - 'deps/vcpkg-configuration.json'
      - 'deps/ports/**'
      - 'deps/triplets/**'
      - 'test/blas_lapack_test.cpp'
      - 'tools/benchmarks/deps-key.py'
      - 'tools/deps-image'
      - 'tools/macos-*'
      - 'tools/build-jobs'
      - 'deps/make_deps.sh'
      - 'deps/fetch_sources.sh'
      - '.github/workflows/deps-image.yml'

permissions:
  contents: read

concurrency:
  group: dependency-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/luxir-dev

# A cold build exceeds one hosted job's six hours, so the image builds as three
# chained jobs per architecture: the toolchain (ARM64 compiles GCC), the normal
# dependencies, then the ASan dependencies and the dev image. Each publishes
# its stage (<key>-<arch>-toolchain, <key>-<arch>-normal, <key>-<arch>) and the
# next builds on it. Architectures are independent: a job runs whatever its
# predecessor's outcome and fails by itself if the stage it needs is missing.
#
# No Actions cache: other workflows in this repository build and run
# untrusted refs and can write cache entries, so every published image
# comes from a cold build. Use all CPUs on each native hosted runner.
jobs:
  macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: tools/macos-toolchain setup
      - name: Build and publish native dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/macos-deps publish

  toolchain:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test key contract
        run: python3 -m unittest discover -s tools/benchmarks -p 'test_deps_key.py'
      - name: Build and publish stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/deps-image toolchain

  normal:
    needs: toolchain
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test key contract
        run: python3 -m unittest discover -s tools/benchmarks -p 'test_deps_key.py'
      - name: Build and publish stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/deps-image normal-dependencies

  publish:
    needs: normal
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test key contract
        run: python3 -m unittest discover -s tools/benchmarks -p 'test_deps_key.py'
      - name: Build and publish stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/deps-image dev
