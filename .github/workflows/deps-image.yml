name: Dependency image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'deps/vcpkg.json'
      - 'deps/vcpkg-configuration.json'
      - 'deps/ports/**'
      - 'deps/triplets/**'
      - 'test/blas_lapack_test.cpp'
      - 'tools/benchmarks/deps-key.py'
      - 'tools/deps-image'
      - '.github/workflows/deps-image.yml'

permissions:
  contents: read

concurrency:
  group: dependency-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/luxir-dev

# A cold build of both dependency variants exceeds one hosted job's six hours,
# so each variant gets its own job. The first publishes its stage as
# <key>-normal; the second builds the ASan variant and the dev image on it.
#
# No Actions cache: other workflows in this repository build and run
# untrusted refs and can write cache entries, so every published image
# comes from a cold build. Hosted runners count two cores; use all CPUs.
jobs:
  normal:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      exists: ${{ steps.image.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test key contract
        run: python3 -m unittest discover -s tools/benchmarks -p 'test_deps_key.py'
      - name: Compute key and check existing tags
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/deps-image plan
      - name: Build and publish normal dependencies
        if: steps.image.outputs.exists != 'true' && steps.image.outputs.normal_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: tools/deps-image build normal-dependencies "$IMAGE-normal"

  publish:
    needs: normal
    if: needs.normal.outputs.exists != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and publish development image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.normal.outputs.image }}
        run: tools/deps-image build dev "$IMAGE" --build-arg "NORMAL_DEPENDENCIES=$IMAGE-normal"
