# Contributor License Agreement check. Every commit author on a pull request
# must have accepted CLA.md once, by commenting the exact phrase below on any
# pull request or issue. Signatures are appended to signatures.json on the
# cla-signatures branch, which is created on the first signature.
#
# pull_request_target runs with a write token in the base repository, so this
# workflow must never check out or execute pull request code. It only reads
# commit metadata and comment text through the API.
name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

env:
  CLA_PHRASE: I have read the Luxir CLA and I hereby sign it.
  CLA_BRANCH: cla-signatures
  CLA_FILE: signatures.json

jobs:
  # No concurrency group: a group keeps only one pending run and cancels the
  # rest, which would drop signatures. Concurrent writes are instead detected
  # by the fast-forward-only ref update and retried.
  sign:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, 'Luxir CLA')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const {CLA_PHRASE: PHRASE, CLA_BRANCH: BRANCH, CLA_FILE: FILE} = process.env;
            const {owner, repo} = context.repo;
            const c = context.payload.comment;
            if (c.body.trim() !== PHRASE) return;
            const defaultBranch = context.payload.repository.default_branch;
            const doc = await github.rest.repos.getContent({owner, repo, path: 'CLA.md', ref: defaultBranch});

            async function load() {
              let head = null;
              try {
                head = (await github.rest.git.getRef({owner, repo, ref: `heads/${BRANCH}`})).data.object.sha;
                const f = await github.rest.repos.getContent({owner, repo, path: FILE, ref: head});
                return {head, sigs: JSON.parse(Buffer.from(f.data.content, 'base64').toString())};
              } catch (e) {
                if (e.status !== 404) throw e;
                return {head, sigs: []};
              }
            }

            for (let attempt = 1; ; attempt++) {
              const {head, sigs} = await load();
              if (sigs.some(s => s.id === c.user.id)) return;
              sigs.push({login: c.user.login, id: c.user.id, cla: doc.data.sha,
                         comment: c.html_url, signed_at: c.created_at});
              const content = JSON.stringify(sigs, null, 2) + '\n';
              const blob = await github.rest.git.createBlob({owner, repo, content, encoding: 'utf-8'});
              const tree = await github.rest.git.createTree({owner, repo,
                tree: [{path: FILE, mode: '100644', type: 'blob', sha: blob.data.sha}]});
              const commit = await github.rest.git.createCommit({owner, repo,
                message: `${c.user.login} signed the CLA`, tree: tree.data.sha, parents: head ? [head] : []});
              try {
                if (head)
                  await github.rest.git.updateRef({owner, repo, ref: `heads/${BRANCH}`, sha: commit.data.sha});
                else
                  await github.rest.git.createRef({owner, repo, ref: `refs/heads/${BRANCH}`, sha: commit.data.sha});
                return;
              } catch (e) {
                // 422: another run moved or created the branch first; reload and reapply.
                if (e.status !== 422 || attempt === 5) throw e;
              }
            }

  # Serialized per pull request so a stale run cannot overwrite a newer status.
  # A pending run replaced by a newer one loses nothing: the newer run
  # re-evaluates the current head and signatures.
  check:
    needs: sign
    if: >-
      !cancelled() && needs.sign.result != 'failure' && (
        github.event_name == 'pull_request_target' ||
        github.event.issue.pull_request && (
          contains(github.event.comment.body, 'Luxir CLA') ||
          github.event.comment.body == 'recheck'))
    concurrency:
      group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const {CLA_PHRASE: PHRASE, CLA_BRANCH: BRANCH, CLA_FILE: FILE} = process.env;
            const MARKER = '<!-- luxir-cla -->';
            // The Steward named in CLA.md does not sign; bots are exempt by account type.
            const EXEMPT = new Set(['yonik']);
            const {owner, repo} = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const claUrl = `https://github.com/${owner}/${repo}/blob/${defaultBranch}/CLA.md`;

            async function loadSigs() {
              try {
                const f = await github.rest.repos.getContent({owner, repo, path: FILE, ref: BRANCH});
                return JSON.parse(Buffer.from(f.data.content, 'base64').toString());
              } catch (e) {
                if (e.status !== 404) throw e;
                return [];
              }
            }

            const prNumber = context.eventName === 'issue_comment'
              ? context.payload.issue.number : context.payload.pull_request.number;
            const pr = (await github.rest.pulls.get({owner, repo, pull_number: prNumber})).data;
            const commits = await github.paginate(github.rest.pulls.listCommits,
              {owner, repo, pull_number: prNumber, per_page: 100});
            const signed = new Set((await loadSigs()).map(s => s.id));
            const missing = new Set();
            const unlinked = new Set();
            for (const c of commits) {
              const a = c.author;
              if (!a) unlinked.add(`${c.commit.author.name} <${c.commit.author.email}>`);
              else if (a.type !== 'Bot' && !EXEMPT.has(a.login) && !signed.has(a.id)) missing.add(a.login);
            }
            const ok = missing.size === 0 && unlinked.size === 0;

            await github.rest.repos.createCommitStatus({owner, repo, sha: pr.head.sha, context: 'CLA',
              state: ok ? 'success' : 'failure', target_url: claUrl,
              description: ok ? 'All commit authors have signed the CLA'
                              : 'Commit authors must sign the CLA'});

            let body;
            if (ok) {
              body = `${MARKER}\nAll commit authors have signed the [Luxir CLA](${claUrl}). Thanks!`;
            } else {
              body = `${MARKER}\nThanks for the contribution. Before it can be merged, each commit author ` +
                `needs to accept the [Luxir CLA](${claUrl}) once, by commenting here with exactly:\n\n` +
                `    ${PHRASE}\n`;
              if (missing.size)
                body += `\nStill needed from: ${[...missing].map(l => '@' + l).join(', ')}\n`;
              if (unlinked.size)
                body += '\nThese commit author emails are not linked to a GitHub account. Add the email to ' +
                  'your account (or amend the commits), then comment `recheck`:\n' +
                  [...unlinked].map(u => `- \`${u}\``).join('\n') + '\n';
            }
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner, repo, issue_number: prNumber, per_page: 100});
            const prev = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(MARKER));
            if (prev) {
              if (prev.body !== body)
                await github.rest.issues.updateComment({owner, repo, comment_id: prev.id, body});
            } else if (!ok) {
              await github.rest.issues.createComment({owner, repo, issue_number: prNumber, body});
            }
